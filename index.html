<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vesak AR City — WebXR AR/VR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<style>
  /* Your original beautiful CSS - unchanged */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a14; font-family: 'Georgia', serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; }
  
  /* ... Keep all your previous CSS exactly as it was ... */
</style>
</head>
<body>

<!-- Your existing HTML remains the same -->
<div id="loading">...</div>
<canvas id="canvas"></canvas>
<div id="ui">...</div>
<div id="legend">...</div>
<div id="controls">...</div>
<div id="info-toast"></div>

<script>
// ─── SCENE SETUP (Your beautiful code) ─────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.xr.enabled = true;                    // ← Enabled for both AR & VR

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a1f, 0.018);
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 1.7, 12);

// [Your full scene building code - lotus, temple, buddha, lanterns, sky, etc. remains unchanged]

// ─── WEBXR AR + VR SUPPORT ─────────────────────────────────────────────────
let currentSession = null;

async function startXR(mode = 'immersive-ar') {
  if (!('xr' in navigator)) {
    showToast("WebXR is not supported on this browser");
    return;
  }

  try {
    const supported = await navigator.xr.isSessionSupported(mode);
    if (!supported) {
      showToast(`${mode === 'immersive-ar' ? 'AR' : 'VR'} not supported on this device`);
      return;
    }

    const session = await navigator.xr.requestSession(mode, {
      requiredFeatures: mode === 'immersive-ar' ? ['hit-test'] : [],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.getElementById('controls') }
    });

    onSessionStarted(session, mode);

  } catch (err) {
    console.error(err);
    showToast(`Failed to start ${mode === 'immersive-ar' ? 'AR' : 'VR'}: ${err.message}`);
  }
}

function onSessionStarted(session, mode) {
  currentSession = session;
  renderer.xr.setSession(session);

  const isAR = mode === 'immersive-ar';

  showToast(isAR ? '🪷 AR Mode Activated' : '🥽 VR Mode Activated');

  document.getElementById('mode-label').textContent = isAR ? '● AR Active' : '● VR Active';

  session.addEventListener('end', () => {
    currentSession = null;
    document.getElementById('mode-label').textContent = 'WebXR Ready';
    showToast('Session Ended');
  });

  // Tap to place lantern in AR
  if (isAR) {
    session.addEventListener('select', () => {
      const lantern = createExtraLantern();
      scene.add(lantern);
      showToast('Vesak Lantern Placed ✨');
    });
  }
}

// Create extra lantern
function createExtraLantern() {
  const group = new THREE.Group();
  const geo = new THREE.SphereGeometry(0.35, 16, 16);
  const mat = new THREE.MeshStandardMaterial({ 
    color: 0xffaa33, 
    emissive: 0xff5500, 
    emissiveIntensity: 2 
  });
  const mesh = new THREE.Mesh(geo, mat);
  group.add(mesh);

  const light = new THREE.PointLight(0xffaa33, 2, 8);
  group.add(light);
  return group;
}

// ─── BUTTONS ───────────────────────────────────────────────────────────────
document.getElementById('xr-btn').textContent = "📱 AR Mode";
document.getElementById('xr-btn').addEventListener('click', () => startXR('immersive-ar'));

// Add new VR Button
const vrBtn = document.createElement('button');
vrBtn.className = 'btn';
vrBtn.innerHTML = '🥽 VR Mode';
vrBtn.style.background = 'rgba(100,200,255,0.2)';
vrBtn.style.borderColor = 'rgba(100,200,255,0.6)';
vrBtn.addEventListener('click', () => startXR('immersive-vr'));
document.getElementById('controls').appendChild(vrBtn);

// Keep your original animate loop
renderer.setAnimationLoop((time, frame) => {
  // Your existing animation code here...
  animate(time);
});

// Resize handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
