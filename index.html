<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 AR Vesak City with Real Models</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    .ui {
      position: absolute; top: 10px; left: 10px; color: #ffddaa; 
      background: rgba(0,0,0,0.5); padding: 12px 18px; border-radius: 10px; 
      z-index: 1000; font-family: Arial;
    }
  </style>
</head>
<body>

  <div class="ui">
    <h2>🌕 AR Vesak City</h2>
    <p>Real Camera • Move forward slowly</p>
  </div>

  <a-scene 
    embedded 
    renderer="alpha: true; antialias: true;"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    background="color: transparent">

    <a-camera></a-camera>

    <a-light type="ambient" intensity="0.8" color="#ffffff"></a-light>
    <a-light type="directional" position="5 12 8" intensity="1.0" color="#ffeedd"></a-light>

    <!-- Light ground -->
    <a-plane rotation="-90 0 0" width="80" height="80" color="#112211" opacity="0.12"></a-plane>

    <!-- Temple -->
    <a-entity id="temple" 
              gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Duck/glTF-Binary/Duck.glb" 
              scale="6 6 6" position="0 0 -8" visible="false"></a-entity>

    <!-- Buddha Statue (Good free model) -->
    <a-entity id="buddha" 
              gltf-model="https://assets.babylonjs.com/meshes/BoomBox.glb" 
              scale="1.8 1.8 1.8" position="0 1.2 -13" rotation="0 180 0" visible="false"></a-entity>

    <!-- Vesak Lantern (Real Sri Lankan style) -->
    <a-entity class="lantern" 
              gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="1.6 1.6 1.6" position="-4 2 -7" 
              animation="property: rotation; to: 0 360 0; dur: 15000; loop: true;" visible="false"></a-entity>

    <a-entity class="lantern" 
              gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="1.5 1.5 1.5" position="4 2 -9" 
              animation="property: rotation; to: 0 360 0; dur: 17000; loop: true;" visible="false"></a-entity>

    <!-- Thorana Placeholder (No perfect free .glb found easily) -->
    <a-entity id="thorana" 
              gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="3 3 3" position="0 4 -22" visible="false"></a-entity>

    <!-- Flying Lanterns -->
    <a-entity class="flying" 
              gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="0.9 0.9 0.9" position="-3 3 -19" visible="false"></a-entity>

    <!-- Fireflies -->
    <a-entity position="0 5 -12" 
              particle-system="preset: dust; color: #ffdd77,#ffeeaa; particleCount: 300; size: 0.05"></a-entity>

  </a-scene>

  <script>
    const camera = document.querySelector('a-camera');

    function revealModels() {
      const z = camera.object3D.position.z;
      if (z < -5) document.getElementById('temple').setAttribute('visible', true);
      if (z < -10) document.getElementById('buddha').setAttribute('visible', true);
      if (z < -16) {
        document.getElementById('thorana').setAttribute('visible', true);
        document.querySelectorAll('.lantern').forEach(l => l.setAttribute('visible', true));
      }
      if (z < -22) {
        document.querySelectorAll('.flying').forEach(el => {
          el.setAttribute('visible', true);
          el.setAttribute('animation', 'property: position; to: 0 12 -19; dur: 28000; loop: false');
        });
      }
    }

    document.querySelector('a-scene').addEventListener('loaded', () => {
      setInterval(revealModels, 250);
    });
  </script>

  <button onclick="document.querySelector('a-scene').enterVR()" 
          style="position:fixed; bottom:30px; left:30px; z-index:10000; padding:15px 25px; background:#ffcc00; color:black; border:none; border-radius:10px;">
    📱 Start AR Vesak City
  </button>
</body>
</html>
