<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vesak AR City - Fixed</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<style>
  body { margin:0; overflow:hidden; background:#000; font-family:Arial; }
  #ui {
    position: fixed; top: 10px; left: 10px; color: #ffddaa; background: rgba(0,0,0,0.7);
    padding: 15px; border-radius: 10px; z-index: 100;
  }
  button {
    position: fixed; bottom: 20px; left: 20px; padding: 15px 25px;
    font-size: 18px; background: #ffcc00; color: black; border: none;
    border-radius: 12px; z-index: 1000;
  }
</style>
</head>
<body>

<div id="ui">
  <h2>🌟 Vesak AR City</h2>
  <p>Tap buttons to start</p>
</div>

<button onclick="startAR()">📱 Start AR Mode</button>
<button onclick="startVR()" style="left: 280px;">🥽 Start VR Mode</button>

<script>
// Scene Setup
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a001f, 0.025);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 2, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

// Lighting
const ambient = new THREE.AmbientLight(0x445577, 0.6);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffddaa, 1.2);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({ color: 0x112211 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// === VISIBLE OBJECTS ===

// Temple (Right)
const temple = new THREE.Mesh(
  new THREE.BoxGeometry(8, 6, 8),
  new THREE.MeshStandardMaterial({ color: 0xd4b896 })
);
temple.position.set(12, 3, -20);
scene.add(temple);

// Buddha (Left)
const buddha = new THREE.Mesh(
  new THREE.SphereGeometry(2.5, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xffd700 })
);
buddha.position.set(-12, 2.5, -18);
scene.add(buddha);

// Lotus Path
for(let i = -25; i <= 25; i += 4){
  // Left Lotus
  const lotusL = new THREE.Mesh(
    new THREE.CircleGeometry(1.2, 8),
    new THREE.MeshStandardMaterial({ color: 0xff69b4 })
  );
  lotusL.rotation.x = -Math.PI/2;
  lotusL.position.set(-4, 0.1, i);
  scene.add(lotusL);

  // Right Lotus
  const lotusR = lotusL.clone();
  lotusR.position.set(4, 0.1, i);
  scene.add(lotusR);
}

// Vesak Lanterns
for(let i = -20; i <= 20; i += 6){
  const lantern = new THREE.Mesh(
    new THREE.SphereGeometry(0.8, 16, 16),
    new THREE.MeshStandardMaterial({ 
      color: 0xffaa00, 
      emissive: 0xff5500, 
      emissiveIntensity: 1.5 
    })
  );
  lantern.position.set(0, 2, i);
  scene.add(lantern);
}

// Flying Lanterns
for(let i = 0; i < 5; i++){
  const fly = new THREE.Mesh(
    new THREE.SphereGeometry(0.6, 12, 12),
    new THREE.MeshStandardMaterial({ color: 0xffee88, emissive: 0xffaa00 })
  );
  fly.position.set(-5 + i*2, 5 + i*2, -15 - i*3);
  scene.add(fly);
}

// Animation
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

// === WEBXR FUNCTIONS ===
async function startAR() {
  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test']
    });
    renderer.xr.setSession(session);
    alert("AR Started! Tap on floor to place objects.");
  } catch(e) {
    alert("AR failed: " + e.message);
  }
}

async function startVR() {
  try {
    const session = await navigator.xr.requestSession('immersive-vr');
    renderer.xr.setSession(session);
    alert("VR Mode Started");
  } catch(e) {
    alert("VR failed: " + e.message);
  }
}

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
