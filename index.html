<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vesak AR City - WebXR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/WebXRButton.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #info {
      position: absolute; top: 10px; left: 10px; color: white; font-family: Arial; 
      background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; z-index: 100;
    }
  </style>
</head>
<body>
  <div id="info">
    <h2>🌸 Vesak AR City</h2>
    <p>Point camera at ground • Lotus Path • Temple • Buddha • Lanterns</p>
  </div>

  <script>
    // Basic Three.js + WebXR setup
    let scene, camera, renderer;
    let xrSession = null;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Add AR button
      const button = document.createElement('button');
      button.textContent = '🌸 Enter Vesak AR';
      button.style.position = 'absolute';
      button.style.bottom = '30px';
      button.style.left = '50%';
      button.style.transform = 'translateX(-50%)';
      button.style.padding = '15px 30px';
      button.style.fontSize = '18px';
      button.style.background = '#FFD700';
      button.style.border = 'none';
      button.style.borderRadius = '12px';
      button.style.cursor = 'pointer';
      button.onclick = () => renderer.xr.startSession('immersive-ar', { requiredFeatures: ['hit-test'] });
      document.body.appendChild(button);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffddaa, 1.2);
      directionalLight.position.set(5, 10, 5);
      scene.add(directionalLight);

      // Ground (Lotus Flower Path)
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 20),
        new THREE.MeshLambertMaterial({ color: 0x228B22 })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // Lotus Flowers along path
      for (let i = -8; i <= 8; i += 2) {
        const lotus = new THREE.Mesh(
          new THREE.CylinderGeometry(0.8, 1.2, 0.3, 8),
          new THREE.MeshPhongMaterial({ color: 0xFF69B4, emissive: 0xFF1493 })
        );
        lotus.position.set(i, 0.2, -5 + Math.random() * 10);
        lotus.rotation.x = Math.random() * 0.5;
        scene.add(lotus);
      }

      // Buddhist Temple (simple stylized)
      const temple = new THREE.Mesh(
        new THREE.BoxGeometry(6, 4, 6),
        new THREE.MeshPhongMaterial({ color: 0xFFD700 })
      );
      temple.position.set(0, 2, -12);
      scene.add(temple);

      // Buddha Statue
      const buddha = new THREE.Mesh(
        new THREE.SphereGeometry(2, 32, 32),
        new THREE.MeshPhongMaterial({ color: 0xFFD700, emissive: 0xFFAA00 })
      );
      buddha.position.set(-4, 1.5, -8);
      scene.add(buddha);

      // Flying Sky Lanterns
      for (let i = 0; i < 15; i++) {
        const lantern = new THREE.Mesh(
          new THREE.BoxGeometry(0.8, 1.2, 0.8),
          new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff, emissive: 0xFFAA00 })
        );
        lantern.position.set(
          Math.random() * 20 - 10,
          3 + Math.random() * 8,
          -15 + Math.random() * 10
        );
        scene.add(lantern);
      }

      // Vesak Lanterns hanging
      for (let i = -10; i <= 10; i += 3) {
        const lantern = new THREE.Mesh(
          new THREE.IcosahedronGeometry(1, 1),
          new THREE.MeshPhongMaterial({ color: 0xFF4500, emissive: 0xFF0000 })
        );
        lantern.position.set(i, 4, -6);
        scene.add(lantern);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
