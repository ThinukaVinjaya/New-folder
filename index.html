<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vesak AR City — WebXR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a14; font-family: 'Georgia', serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; }

  #ui {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 20px 24px; pointer-events: none;
  }
  #title-block { text-align: left; }
  #title-block h1 {
    font-size: clamp(18px, 3vw, 26px);
    color: #ffd970; letter-spacing: 0.08em;
    text-shadow: 0 0 20px rgba(255,200,50,0.6), 0 2px 4px rgba(0,0,0,0.8);
    font-weight: normal;
  }
  #title-block p {
    font-size: 12px; color: rgba(255,220,120,0.7);
    letter-spacing: 0.12em; margin-top: 4px;
  }
  #status {
    text-align: right; font-size: 12px;
    color: rgba(255,220,120,0.75); letter-spacing: 0.08em;
  }
  #status span { display: block; margin-bottom: 2px; }

  #controls {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    padding: 18px 24px; display: flex; gap: 10px;
    justify-content: center; align-items: center; flex-wrap: wrap;
    background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, transparent 100%);
  }
  .btn {
    background: rgba(255,200,60,0.12);
    border: 1px solid rgba(255,200,60,0.4);
    color: #ffd970; font-family: 'Georgia', serif;
    font-size: 12px; letter-spacing: 0.1em;
    padding: 8px 16px; border-radius: 20px;
    cursor: pointer; pointer-events: all;
    transition: all 0.2s;
  }
  .btn:hover { background: rgba(255,200,60,0.28); border-color: rgba(255,200,60,0.7); }
  .btn.active { background: rgba(255,200,60,0.3); border-color: #ffd970; }

  #xr-btn {
    background: rgba(255,140,50,0.18);
    border: 1px solid rgba(255,140,50,0.5);
    color: #ffb060; font-size: 13px; font-weight: bold;
    padding: 10px 22px; border-radius: 24px;
  }
  #xr-btn:hover { background: rgba(255,140,50,0.35); }

  #legend {
    position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
    z-index: 100; display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  .leg { display: flex; align-items: center; gap: 8px; font-size: 11px;
    color: rgba(255,220,120,0.75); letter-spacing: 0.06em; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  #loading {
    position: fixed; inset: 0; background: #0a0a14;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 200; transition: opacity 0.8s;
  }
  #loading h2 { color: #ffd970; font-size: 22px; font-weight: normal; letter-spacing: 0.1em; margin-bottom: 12px; }
  #loading p { color: rgba(255,200,100,0.6); font-size: 13px; letter-spacing: 0.08em; }
  #load-bar { width: 200px; height: 2px; background: rgba(255,200,60,0.2); margin-top: 20px; border-radius: 1px; overflow: hidden; }
  #load-fill { width: 0%; height: 100%; background: #ffd970; transition: width 0.3s; border-radius: 1px; }

  #info-toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); border: 1px solid rgba(255,200,60,0.3);
    color: #ffd970; font-size: 12px; letter-spacing: 0.08em;
    padding: 8px 20px; border-radius: 20px; z-index: 150;
    opacity: 0; transition: opacity 0.4s; pointer-events: none;
  }
  #info-toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="loading">
  <h2>🪷 VESAK AR CITY</h2>
  <p>Building the sacred path…</p>
  <div id="load-bar"><div id="load-fill"></div></div>
</div>

<canvas id="canvas"></canvas>

<div id="ui">
  <div id="title-block">
    <h1>🪷 Vesak AR City</h1>
    <p>VESAK POYA — SACRED IMMERSIVE EXPERIENCE</p>
  </div>
  <div id="status">
    <span id="fps-counter">60 FPS</span>
    <span id="cam-pos">Position: Origin</span>
    <span id="mode-label">WebXR Ready</span>
  </div>
</div>

<div id="legend">
  <div class="leg"><div class="leg-dot" style="background:#ffd970"></div>Vesak Lanterns</div>
  <div class="leg"><div class="leg-dot" style="background:#ff9f50"></div>Sky Lanterns</div>
  <div class="leg"><div class="leg-dot" style="background:#ff6a9e"></div>Lotus Flowers</div>
  <div class="leg"><div class="leg-dot" style="background:#c8a86b"></div>Temple</div>
  <div class="leg"><div class="leg-dot" style="background:#8fd4ff"></div>Buddha Statue</div>
</div>

<div id="controls">
  <button class="btn" id="btn-walk">🚶 Walk Forward</button>
  <button class="btn" id="btn-left">◀ Turn Left</button>
  <button class="btn" id="btn-right">▶ Turn Right</button>
  <button class="btn" id="btn-overview">🌐 Overview</button>
  <button class="btn" id="btn-night" class="active">🌙 Night Mode</button>
  <button class="btn" id="btn-day">☀️ Day Mode</button>
  <button class="btn xr-btn" id="xr-btn">📱 Enter AR (WebXR)</button>
</div>

<div id="info-toast" id="toast"></div>

<script>
// ─── SCENE SETUP ──────────────────────────────────────────────────────────────
const W = window.innerWidth, H = window.innerHeight;
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a1f, 0.018);

const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 300);
camera.position.set(0, 1.7, 12);
camera.lookAt(0, 1.7, 0);

// ─── STATE ────────────────────────────────────────────────────────────────────
let isNight = true;
let walkForward = false, turnLeft = false, turnRight = false;
let camAngle = 0, camSpeed = 0;
const clock = new THREE.Clock();
let frameCount = 0, fpsTime = 0;
const skyLanterns = [], pathLanterns = [], lotusFlowers = [], particleSystems = [];

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function mat(color, options = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.1, ...options });
}
function glow(color, intensity = 1) {
  return new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: intensity, roughness: 1 });
}

// ─── SKY ──────────────────────────────────────────────────────────────────────
function buildSky() {
  const skyGeo = new THREE.SphereGeometry(200, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: { uTime: { value: 0 }, uNight: { value: 1.0 } },
    vertexShader: `varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `
      uniform float uTime, uNight;
      varying vec3 vPos;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      void main(){
        vec3 n = normalize(vPos);
        float h = n.y * 0.5 + 0.5;
        vec3 dayTop = vec3(0.3,0.55,0.9); vec3 dayHor = vec3(0.7,0.85,1.0);
        vec3 nightTop = vec3(0.01,0.01,0.08); vec3 nightHor = vec3(0.05,0.04,0.12);
        vec3 day = mix(dayHor, dayTop, h);
        vec3 night = mix(nightHor, nightTop, h);
        vec3 sky = mix(day, night, uNight);
        vec2 uv = vec2(atan(n.x,n.z)*0.159+0.5, asin(n.y)*0.318+0.5);
        float star = 0.0;
        if(uNight > 0.3){
          for(float i=0.;i<4.;i++){
            vec2 g = floor(uv*(60.+i*30.));
            float s = hash(g+i); float b = hash(g+i+0.5);
            float tw = 0.5+0.5*sin(uTime*(0.5+b*2.)+b*6.28);
            star += step(0.97,s)*tw*uNight*0.8;
          }
        }
        gl_FragColor = vec4(sky + star, 1.0);
      }
    `
  });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);
  return skyMat;
}
const skyMat = buildSky();

// ─── GROUND / FLOOR ───────────────────────────────────────────────────────────
function buildGround() {
  // Main ground
  const geo = new THREE.PlaneGeometry(120, 120, 60, 60);
  const mat2 = new THREE.MeshStandardMaterial({ color: 0x1a3a1a, roughness: 0.9 });
  const ground = new THREE.Mesh(geo, mat2);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Path down the center
  const pathGeo = new THREE.PlaneGeometry(4, 60);
  const pathMat = new THREE.MeshStandardMaterial({ color: 0xc8a86b, roughness: 0.8 });
  const path = new THREE.Mesh(pathGeo, pathMat);
  path.rotation.x = -Math.PI / 2;
  path.position.set(0, 0.01, 0);
  scene.add(path);

  // Path edge lines
  for (let side of [-2.1, 2.1]) {
    const edgeGeo = new THREE.PlaneGeometry(0.15, 60);
    const edgeMat = new THREE.MeshStandardMaterial({ color: 0xe8c87c });
    const edge = new THREE.Mesh(edgeGeo, edgeMat);
    edge.rotation.x = -Math.PI / 2;
    edge.position.set(side, 0.02, 0);
    scene.add(edge);
  }

  // Water pools with lotus on sides
  for (let z = -20; z <= 20; z += 8) {
    for (let side of [-8, 8]) {
      const poolGeo = new THREE.CircleGeometry(2.5, 32);
      const poolMat = new THREE.MeshStandardMaterial({
        color: 0x1a4a6a, roughness: 0.1, metalness: 0.3,
        transparent: true, opacity: 0.85
      });
      const pool = new THREE.Mesh(poolGeo, poolMat);
      pool.rotation.x = -Math.PI / 2;
      pool.position.set(side, 0.02, z);
      scene.add(pool);
    }
  }
}
buildGround();

// ─── LOTUS FLOWERS ────────────────────────────────────────────────────────────
function buildLotus(x, y, z, scale = 1) {
  const group = new THREE.Group();

  // Pad
  const padGeo = new THREE.CircleGeometry(0.5 * scale, 16);
  const padMat = new THREE.MeshStandardMaterial({ color: 0x2d6e2d, roughness: 0.8 });
  const pad = new THREE.Mesh(padGeo, padMat);
  pad.rotation.x = -Math.PI / 2;
  group.add(pad);

  // Petals - multiple rings
  const petalColors = [0xff6a9e, 0xff85b2, 0xffaac8, 0xffd0e0];
  for (let ring = 0; ring < 3; ring++) {
    const petalCount = 8 + ring * 4;
    const petalR = (0.15 + ring * 0.1) * scale;
    const petalD = (0.25 + ring * 0.15) * scale;
    const tiltAngle = (0.3 + ring * 0.25) * (Math.PI / 2);
    for (let i = 0; i < petalCount; i++) {
      const angle = (i / petalCount) * Math.PI * 2;
      const petalGeo = new THREE.SphereGeometry(petalR, 8, 8, 0, Math.PI * 2, 0, Math.PI * 0.55);
      const petalMat = new THREE.MeshStandardMaterial({
        color: petalColors[Math.min(ring, 3)],
        roughness: 0.5, side: THREE.DoubleSide,
        transparent: true, opacity: 0.9
      });
      const petal = new THREE.Mesh(petalGeo, petalMat);
      petal.position.set(
        Math.sin(angle) * petalD,
        (0.05 + ring * 0.08) * scale,
        Math.cos(angle) * petalD
      );
      petal.rotation.y = angle;
      petal.rotation.x = -tiltAngle;
      group.add(petal);
    }
  }

  // Center stamen
  const stamGeo = new THREE.SphereGeometry(0.1 * scale, 8, 8);
  const stamMat = new THREE.MeshStandardMaterial({ color: 0xffd940, emissive: 0xffa800, emissiveIntensity: 0.4 });
  const stamen = new THREE.Mesh(stamGeo, stamMat);
  stamen.position.y = 0.25 * scale;
  group.add(stamen);

  // Stem
  const stemGeo = new THREE.CylinderGeometry(0.02 * scale, 0.02 * scale, 0.4 * scale, 6);
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x3a7a3a });
  const stem = new THREE.Mesh(stemGeo, stemMat);
  stem.position.y = -0.2 * scale;
  group.add(stem);

  group.position.set(x, y, z);
  scene.add(group);
  lotusFlowers.push({ group, baseY: y, phase: Math.random() * Math.PI * 2 });
  return group;
}

// Place lotuses along path sides and in pools
for (let z = -25; z <= 25; z += 2.5) {
  for (let side of [-3.2, 3.2]) {
    buildLotus(side + (Math.random() - 0.5) * 1, 0.02, z + (Math.random() - 0.5) * 1, 0.5 + Math.random() * 0.4);
  }
}
// Pools
for (let z = -20; z <= 20; z += 8) {
  for (let side of [-8, 8]) {
    for (let k = 0; k < 5; k++) {
      const angle = (k / 5) * Math.PI * 2;
      buildLotus(side + Math.cos(angle) * 1.5, 0.03, z + Math.sin(angle) * 1.5, 0.7 + Math.random() * 0.3);
    }
    buildLotus(side, 0.03, z, 0.9);
  }
}

// ─── VESAK LANTERNS (path) ─────────────────────────────────────────────────
function buildVesakLantern(x, y, z, scale = 1) {
  const group = new THREE.Group();

  // Body
  const bodyGeo = new THREE.CylinderGeometry(0.22 * scale, 0.18 * scale, 0.45 * scale, 8);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0xff3300, emissive: 0xff2200, emissiveIntensity: 0.4,
    transparent: true, opacity: 0.85
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  group.add(body);

  // Top cap
  const topGeo = new THREE.ConeGeometry(0.25 * scale, 0.2 * scale, 8);
  const topMat = mat(0xcc2200);
  const top = new THREE.Mesh(topGeo, topMat);
  top.position.y = 0.32 * scale;
  group.add(top);

  // Bottom cap
  const botGeo = new THREE.ConeGeometry(0.2 * scale, 0.15 * scale, 8);
  botGeo.rotateX(Math.PI);
  const bot = new THREE.Mesh(botGeo, topMat.clone());
  bot.position.y = -0.29 * scale;
  group.add(bot);

  // Inner glow sphere
  const glowGeo = new THREE.SphereGeometry(0.15 * scale, 8, 8);
  const glowMat = new THREE.MeshStandardMaterial({
    color: 0xffdd88, emissive: 0xffcc44, emissiveIntensity: 2.5,
    transparent: true, opacity: 0.9
  });
  const glowBall = new THREE.Mesh(glowGeo, glowMat);
  group.add(glowBall);

  // Point light inside
  const light = new THREE.PointLight(0xffaa33, 0.8 * scale, 4 * scale);
  light.position.set(0, 0, 0);
  group.add(light);

  // Decorative rings
  for (let ring = 0; ring < 3; ring++) {
    const ringGeo = new THREE.TorusGeometry(0.23 * scale, 0.012 * scale, 4, 12);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 0.5 });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.position.y = (-0.1 + ring * 0.12) * scale;
    ringMesh.rotation.x = Math.PI / 2;
    group.add(ringMesh);
  }

  // Tassels
  for (let t = 0; t < 4; t++) {
    const angle = (t / 4) * Math.PI * 2;
    const tasGeo = new THREE.CylinderGeometry(0.008 * scale, 0.002 * scale, 0.2 * scale, 4);
    const tasMat = new THREE.MeshStandardMaterial({ color: 0xffdd44 });
    const tas = new THREE.Mesh(tasGeo, tasMat);
    tas.position.set(Math.sin(angle) * 0.12 * scale, -0.39 * scale, Math.cos(angle) * 0.12 * scale);
    group.add(tas);
  }

  group.position.set(x, y, z);
  scene.add(group);
  pathLanterns.push({ group, baseY: y, light, glowMat, phase: Math.random() * Math.PI * 2 });
  return group;
}

// Path lanterns on poles
for (let z = -24; z <= 24; z += 4) {
  for (let side of [-2.8, 2.8]) {
    // Pole
    const poleGeo = new THREE.CylinderGeometry(0.04, 0.05, 3, 6);
    const poleMat = mat(0x8b7355);
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.set(side, 1.5, z);
    scene.add(pole);
    buildVesakLantern(side, 3.1, z, 0.7);
  }
}

// ─── SKY LANTERNS (flying up) ──────────────────────────────────────────────
function buildSkyLantern(x, y, z) {
  const group = new THREE.Group();

  // Paper balloon body
  const ballGeo = new THREE.SphereGeometry(0.35, 12, 8);
  ballGeo.scale(1, 1.4, 1);
  const ballMat = new THREE.MeshStandardMaterial({
    color: 0xffee88, emissive: 0xffcc22, emissiveIntensity: 1.2,
    transparent: true, opacity: 0.75, side: THREE.DoubleSide
  });
  const ball = new THREE.Mesh(ballGeo, ballMat);
  group.add(ball);

  // Opening at bottom
  const openGeo = new THREE.RingGeometry(0.12, 0.3, 12);
  const openMat = new THREE.MeshStandardMaterial({ color: 0x884400, side: THREE.DoubleSide });
  const open = new THREE.Mesh(openGeo, openMat);
  open.position.y = -0.45;
  open.rotation.x = Math.PI / 2;
  group.add(open);

  // Flame inside
  const flameGeo = new THREE.ConeGeometry(0.06, 0.18, 6);
  const flameMat = new THREE.MeshStandardMaterial({ color: 0xff8800, emissive: 0xff5500, emissiveIntensity: 3 });
  const flame = new THREE.Mesh(flameGeo, flameMat);
  flame.position.y = -0.28;
  group.add(flame);

  // Light
  const light = new THREE.PointLight(0xffaa33, 1.2, 6);
  group.add(light);

  // Strings
  for (let s = 0; s < 4; s++) {
    const angle = (s / 4) * Math.PI * 2;
    const pts = [
      new THREE.Vector3(Math.sin(angle) * 0.28, -0.1, Math.cos(angle) * 0.28),
      new THREE.Vector3(Math.sin(angle) * 0.12, -0.45, Math.cos(angle) * 0.12),
    ];
    const lineMat = new THREE.LineBasicMaterial({ color: 0x886622 });
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
    group.add(new THREE.Line(lineGeo, lineMat));
  }

  group.position.set(x, y, z);
  scene.add(group);
  skyLanterns.push({
    group, light, ballMat, flameMat,
    startY: y, maxY: y + 60 + Math.random() * 30,
    speed: 0.8 + Math.random() * 1.2,
    driftX: (Math.random() - 0.5) * 0.3,
    driftZ: (Math.random() - 0.5) * 0.3,
    phase: Math.random() * Math.PI * 2,
    active: true
  });
  return group;
}

// Launch sky lanterns from various ground positions
const launchPositions = [
  [0, 0.5, -5], [3, 0.5, -8], [-3, 0.5, -10], [5, 0.5, 0], [-5, 0.5, 3],
  [8, 0.5, -4], [-8, 0.5, -6], [2, 0.5, 6], [-2, 0.5, 8], [6, 0.5, 10],
  [-6, 0.5, 12], [4, 0.5, -15], [-4, 0.5, -18], [10, 0.5, -2], [-10, 0.5, 5],
  [1, 0.5, -20], [-1, 0.5, 20], [7, 0.5, 15], [-7, 0.5, -15], [9, 0.5, 8],
];
launchPositions.forEach(([x, y, z]) => buildSkyLantern(x, y, z));

// ─── TEMPLE (RIGHT SIDE) ───────────────────────────────────────────────────
function buildTemple() {
  const group = new THREE.Group();
  group.position.set(18, 0, -5);

  // Platform / base
  const baseGeo = new THREE.BoxGeometry(14, 0.6, 14);
  const baseMat = mat(0xd4b896, { roughness: 0.7 });
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = 0.3;
  base.castShadow = true; base.receiveShadow = true;
  group.add(base);

  // Steps
  for (let s = 0; s < 4; s++) {
    const stepGeo = new THREE.BoxGeometry(14 - s * 0.5, 0.25, 0.8);
    const stepMesh = new THREE.Mesh(stepGeo, baseMat.clone());
    stepMesh.position.set(0, 0.6 + s * 0.25, 6.5 - s * 0.4);
    group.add(stepMesh);
  }

  // Main hall body
  const hallGeo = new THREE.BoxGeometry(10, 5, 10);
  const hallMat = mat(0xe8d4a8, { roughness: 0.6 });
  const hall = new THREE.Mesh(hallGeo, hallMat);
  hall.position.y = 3.1;
  hall.castShadow = true;
  group.add(hall);

  // Main roof (tiered)
  for (let tier = 0; tier < 3; tier++) {
    const w = 12 - tier * 2; const d = 12 - tier * 2;
    const roofGeo = new THREE.ConeGeometry(Math.sqrt(w * w + d * d) * 0.6 - tier * 0.5, 1.2, 4);
    const roofMat = mat(0x8b2500, { roughness: 0.5 });
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.y = 5.8 + tier * 1.4;
    roof.rotation.y = Math.PI / 4;
    roof.scale.set(1, 1, 0.85);
    roof.castShadow = true;
    group.add(roof);
  }

  // Spire
  const spireGeo = new THREE.CylinderGeometry(0.05, 0.2, 2.5, 8);
  const spireMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
  const spire = new THREE.Mesh(spireGeo, spireMat);
  spire.position.y = 10.2;
  group.add(spire);

  // Spire finial
  const finGeo = new THREE.SphereGeometry(0.25, 8, 8);
  const finMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1, emissive: 0xffd700, emissiveIntensity: 0.3 });
  const finial = new THREE.Mesh(finGeo, finMat);
  finial.position.y = 11.5;
  group.add(finial);

  // Columns
  for (let cx = -3.5; cx <= 3.5; cx += 3.5) {
    for (let cz = -3.5; cz <= 3.5; cz += 3.5) {
      if (Math.abs(cx) < 2 && Math.abs(cz) < 2) continue;
      const colGeo = new THREE.CylinderGeometry(0.25, 0.3, 5, 8);
      const colMat = mat(0xf0e0c0);
      const col = new THREE.Mesh(colGeo, colMat);
      col.position.set(cx, 3.1, cz);
      col.castShadow = true;
      group.add(col);
    }
  }

  // Door opening
  const doorGeo = new THREE.BoxGeometry(1.8, 3.2, 0.2);
  const doorMat = mat(0x4a2800);
  const door = new THREE.Mesh(doorGeo, doorMat);
  door.position.set(0, 2.2, 5.1);
  group.add(door);

  // Temple lanterns
  for (let lx of [-4.5, 4.5]) {
    buildVesakLantern(group.position.x + lx, group.position.y + 0.8, group.position.z + 7, 0.9);
  }

  // Interior glow
  const intLight = new THREE.PointLight(0xffcc66, 1.5, 15);
  intLight.position.y = 2;
  group.add(intLight);

  // Buddha shrine inside
  const buddhaSmallGeo = new THREE.CylinderGeometry(0.3, 0.5, 1.8, 8);
  const buddhaSmallMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.6, roughness: 0.3 });
  const buddhaSmall = new THREE.Mesh(buddhaSmallGeo, buddhaSmallMat);
  buddhaSmall.position.set(0, 2.5, -3);
  group.add(buddhaSmall);

  scene.add(group);
}
buildTemple();

// ─── BUDDHA STATUE (LEFT SIDE) ────────────────────────────────────────────
function buildBuddha() {
  const group = new THREE.Group();
  group.position.set(-18, 0, -5);

  // Pedestal
  const pedGeo = new THREE.CylinderGeometry(3, 3.5, 1.5, 8);
  const pedMat = mat(0xd4c4a0, { roughness: 0.7 });
  const ped = new THREE.Mesh(pedGeo, pedMat);
  ped.position.y = 0.75;
  ped.castShadow = true;
  group.add(ped);

  // Lotus base
  for (let p = 0; p < 12; p++) {
    const angle = (p / 12) * Math.PI * 2;
    const lpGeo = new THREE.SphereGeometry(0.5, 6, 6, 0, Math.PI * 2, 0, Math.PI / 2);
    const lpMat = new THREE.MeshStandardMaterial({ color: 0xff9fc8, roughness: 0.5 });
    const lp = new THREE.Mesh(lpGeo, lpMat);
    lp.position.set(Math.sin(angle) * 2.2, 1.6, Math.cos(angle) * 2.2);
    lp.rotation.x = -Math.PI / 2;
    lp.rotation.y = angle;
    group.add(lp);
  }

  // Body torso
  const torsoGeo = new THREE.SphereGeometry(1.2, 12, 10);
  torsoGeo.scale(0.9, 1.1, 0.75);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd4a850, metalness: 0.4, roughness: 0.4 });
  const torso = new THREE.Mesh(torsoGeo, bodyMat);
  torso.position.y = 3.5;
  torso.castShadow = true;
  group.add(torso);

  // Head
  const headGeo = new THREE.SphereGeometry(0.75, 12, 10);
  const headMat = new THREE.MeshStandardMaterial({ color: 0xe8c060, metalness: 0.5, roughness: 0.3 });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 5.2;
  head.castShadow = true;
  group.add(head);

  // Ushnisha (topknot)
  const ushnGeo = new THREE.SphereGeometry(0.35, 8, 8);
  const ushn = new THREE.Mesh(ushnGeo, headMat.clone());
  ushn.position.y = 5.85;
  group.add(ushn);

  // Hair curls
  for (let hc = 0; hc < 16; hc++) {
    const angle = (hc / 16) * Math.PI * 2;
    const r = 0.55 + Math.random() * 0.1;
    const curlGeo = new THREE.SphereGeometry(0.1, 5, 5);
    const curlMat = new THREE.MeshStandardMaterial({ color: 0x2244aa, metalness: 0.3 });
    const curl = new THREE.Mesh(curlGeo, curlMat);
    curl.position.set(
      group.position.x + Math.sin(angle) * r,
      5.5 + Math.cos(hc * 0.7) * 0.2,
      group.position.z + Math.cos(angle) * r * 0.8
    );
    scene.add(curl);
  }

  // Eyes
  for (let ex of [-0.22, 0.22]) {
    const eyeGeo = new THREE.SphereGeometry(0.08, 6, 6);
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(ex, 5.22, 0.68);
    group.add(eye);
  }

  // Smile
  const smileGeo = new THREE.TorusGeometry(0.2, 0.025, 4, 12, Math.PI);
  const smileMat = new THREE.MeshStandardMaterial({ color: 0x8b6020 });
  const smile = new THREE.Mesh(smileGeo, smileMat);
  smile.position.set(0, 4.9, 0.68);
  smile.rotation.z = Math.PI;
  group.add(smile);

  // Meditation hands
  for (let mx of [-0.5, 0.5]) {
    const handGeo = new THREE.SphereGeometry(0.3, 8, 8);
    handGeo.scale(1.5, 0.7, 1);
    const handMat = new THREE.MeshStandardMaterial({ color: 0xd4a850, metalness: 0.4 });
    const hand = new THREE.Mesh(handGeo, handMat);
    hand.position.set(mx * 0.8, 2.8, 0.5);
    group.add(hand);
  }

  // Robe folds
  const robeGeo = new THREE.CylinderGeometry(0.9, 1.4, 1.5, 12);
  const robeMat = new THREE.MeshStandardMaterial({ color: 0xcc8800, roughness: 0.7 });
  const robe = new THREE.Mesh(robeGeo, robeMat);
  robe.position.y = 2.2;
  group.add(robe);

  // Halo
  const haloGeo = new THREE.RingGeometry(0.9, 1.1, 32);
  const haloMat = new THREE.MeshStandardMaterial({
    color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 0.8,
    transparent: true, opacity: 0.7, side: THREE.DoubleSide
  });
  const halo = new THREE.Mesh(haloGeo, haloMat);
  halo.position.set(0, 5.2, -0.5);
  group.add(halo);

  // Divine light
  const divLight = new THREE.PointLight(0xffeebb, 2, 20);
  divLight.position.y = 5;
  group.add(divLight);

  // Offering flowers around base
  for (let f = 0; f < 8; f++) {
    const ang = (f / 8) * Math.PI * 2;
    buildLotus(group.position.x + Math.sin(ang) * 4.5, 0.02, group.position.z + Math.cos(ang) * 4.5, 0.6);
  }

  scene.add(group);
  return { group, haloMat, divLight };
}
const buddhaObj = buildBuddha();

// ─── DECORATIVE TREES / BODHI TREES ───────────────────────────────────────
function buildBodhiTree(x, y, z, scale = 1) {
  const group = new THREE.Group();

  const trunkGeo = new THREE.CylinderGeometry(0.15 * scale, 0.25 * scale, 3 * scale, 8);
  const trunkMat = mat(0x5a3a1a, { roughness: 0.9 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 1.5 * scale;
  group.add(trunk);

  for (let b = 0; b < 5; b++) {
    const angle = (b / 5) * Math.PI * 2;
    const bGeo = new THREE.SphereGeometry(1.2 * scale * (0.8 + Math.random() * 0.4), 8, 6);
    const bMat = new THREE.MeshStandardMaterial({ color: 0x2d6e2d, roughness: 0.8 });
    const bMesh = new THREE.Mesh(bGeo, bMat);
    bMesh.position.set(
      Math.sin(angle) * 1.0 * scale,
      (3 + Math.random() * 1.5) * scale,
      Math.cos(angle) * 1.0 * scale
    );
    bMesh.castShadow = true;
    group.add(bMesh);
  }

  group.position.set(x, y, z);
  scene.add(group);
}

for (let z = -20; z <= 20; z += 7) {
  buildBodhiTree(-13, 0, z, 0.8 + Math.random() * 0.4);
  buildBodhiTree(13, 0, z, 0.8 + Math.random() * 0.4);
}

// ─── AMBIENT PARTICLES (fireflies / petals) ───────────────────────────────
function buildParticleSystem(count, color, area, height, size) {
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * area;
    positions[i * 3 + 1] = Math.random() * height;
    positions[i * 3 + 2] = (Math.random() - 0.5) * area;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const pMat = new THREE.PointsMaterial({ color, size, transparent: true, opacity: 0.8, depthWrite: false });
  const pts = new THREE.Points(geo, pMat);
  scene.add(pts);
  particleSystems.push({ pts, pMat, positions: geo.attributes.position, speeds: Array.from({ length: count }, () => Math.random() * 0.5 + 0.2) });
  return pts;
}

buildParticleSystem(200, 0xffee88, 60, 8, 0.08);  // fireflies
buildParticleSystem(150, 0xff9fc8, 40, 4, 0.06);  // petals
buildParticleSystem(100, 0xffffff, 80, 20, 0.04); // stars low

// ─── LIGHTING ──────────────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x221133, 0.5);
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0x8899cc, 0.4);
moonLight.position.set(-20, 40, -10);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
scene.add(moonLight);

const sunLight = new THREE.DirectionalLight(0xffddaa, 1.2);
sunLight.position.set(20, 40, 10);
sunLight.castShadow = true;
scene.add(sunLight);
sunLight.visible = false;

// Path warm accent light
const pathLight = new THREE.PointLight(0xffaa44, 0.6, 25);
pathLight.position.set(0, 2, 0);
scene.add(pathLight);

// ─── NAVIGATION ────────────────────────────────────────────────────────────
let camTarget = new THREE.Vector3(0, 1.7, 12);
let lookTarget = new THREE.Vector3(0, 1.7, 0);
const WALK_SPEED = 5;

document.getElementById('btn-walk').addEventListener('mousedown', () => walkForward = true);
document.getElementById('btn-walk').addEventListener('mouseup', () => walkForward = false);
document.getElementById('btn-walk').addEventListener('touchstart', e => { e.preventDefault(); walkForward = true; });
document.getElementById('btn-walk').addEventListener('touchend', () => walkForward = false);

document.getElementById('btn-left').addEventListener('mousedown', () => turnLeft = true);
document.getElementById('btn-left').addEventListener('mouseup', () => turnLeft = false);
document.getElementById('btn-right').addEventListener('mousedown', () => turnRight = true);
document.getElementById('btn-right').addEventListener('mouseup', () => turnRight = false);

document.getElementById('btn-overview').addEventListener('click', () => {
  camTarget.set(0, 25, 30);
  lookTarget.set(0, 0, 0);
  showToast('Overview mode — see the full Vesak City');
});

document.getElementById('btn-night').addEventListener('click', () => {
  setNight(true);
  showToast('Night mode — lanterns glow in the dark');
});
document.getElementById('btn-day').addEventListener('click', () => {
  setNight(false);
  showToast('Day mode — lotus flowers in morning light');
});

function setNight(night) {
  isNight = night;
  skyMat.uniforms.uNight.value = night ? 1.0 : 0.0;
  ambientLight.intensity = night ? 0.5 : 1.5;
  ambientLight.color.set(night ? 0x221133 : 0x99aabb);
  moonLight.visible = night;
  sunLight.visible = !night;
  scene.fog.color.set(night ? 0x0a0a1f : 0xccddee);
  pathLanterns.forEach(l => l.light.intensity = night ? 0.8 : 0.3);
  skyLanterns.forEach(l => l.light.intensity = night ? 1.2 : 0.4);
}

// ─── WEBXR ─────────────────────────────────────────────────────────────────
document.getElementById('xr-btn').addEventListener('click', async () => {
  if ('xr' in navigator) {
    try {
      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (supported) {
        renderer.xr.enabled = true;
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.getElementById('controls') }
        });
        renderer.xr.setSession(session);
        showToast('AR Mode Active — Walk through the Vesak City!');
        document.getElementById('mode-label').textContent = '● AR Active';
      } else {
        const vr = await navigator.xr.isSessionSupported('immersive-vr');
        if (vr) {
          renderer.xr.enabled = true;
          const session = await navigator.xr.requestSession('immersive-vr');
          renderer.xr.setSession(session);
          showToast('VR Mode Active!');
        } else {
          showToast('AR/VR not supported on this device — using 3D mode');
        }
      }
    } catch (e) {
      showToast('WebXR: ' + (e.message || 'Not available — using 3D preview'));
    }
  } else {
    showToast('WebXR API not detected — running as 3D preview');
  }
});

// ─── TOAST ────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('info-toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── KEYBOARD ─────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === 'w') walkForward = true;
  if (e.key === 'ArrowLeft' || e.key === 'a') turnLeft = true;
  if (e.key === 'ArrowRight' || e.key === 'd') turnRight = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp' || e.key === 'w') walkForward = false;
  if (e.key === 'ArrowLeft' || e.key === 'a') turnLeft = false;
  if (e.key === 'ArrowRight' || e.key === 'd') turnRight = false;
});

// Touch drag look
let touchStart = null;
canvas.addEventListener('touchstart', e => { touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });
canvas.addEventListener('touchmove', e => {
  if (!touchStart) return;
  const dx = e.touches[0].clientX - touchStart.x;
  camAngle -= dx * 0.005;
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});

// Mouse drag look
let mouseDown = false, lastMouse = null;
canvas.addEventListener('mousedown', e => { mouseDown = true; lastMouse = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('mousemove', e => {
  if (!mouseDown || !lastMouse) return;
  camAngle -= (e.clientX - lastMouse.x) * 0.005;
  lastMouse = { x: e.clientX, y: e.clientY };
});

// ─── ANIMATE ───────────────────────────────────────────────────────────────
function animate(time) {
  const t = time / 1000;
  const dt = clock.getDelta();

  skyMat.uniforms.uTime.value = t;

  // Camera movement
  if (turnLeft) camAngle += dt * 1.2;
  if (turnRight) camAngle -= dt * 1.2;

  if (walkForward) {
    const dir = new THREE.Vector3(Math.sin(camAngle), 0, Math.cos(camAngle));
    camera.position.addScaledVector(dir, -WALK_SPEED * dt);
    pathLight.position.copy(camera.position);
    pathLight.position.y = 2;
  }

  const lookDir = new THREE.Vector3(Math.sin(camAngle), 0, Math.cos(camAngle));
  camera.lookAt(camera.position.clone().sub(lookDir));

  // Floating lanterns
  pathLanterns.forEach(({ group, light, glowMat, phase }) => {
    const bob = Math.sin(t * 1.2 + phase) * 0.08;
    group.position.y = group.userData.baseY !== undefined ? group.userData.baseY + bob : group.position.y;
    const flicker = 0.7 + 0.3 * Math.sin(t * 8 + phase);
    light.intensity = isNight ? flicker * 0.9 : flicker * 0.3;
    glowMat.emissiveIntensity = 1.5 + Math.sin(t * 5 + phase) * 0.8;
  });

  // Sky lanterns rising
  skyLanterns.forEach(sl => {
    if (!sl.active) return;
    sl.group.position.y += sl.speed * dt;
    sl.group.position.x += sl.driftX * dt;
    sl.group.position.z += sl.driftZ * dt;
    sl.group.rotation.y += 0.3 * dt;
    const sway = Math.sin(t * 0.8 + sl.phase) * 0.003;
    sl.group.rotation.z = sway;
    const flicker = 0.8 + 0.4 * Math.sin(t * 6 + sl.phase);
    sl.light.intensity = isNight ? flicker * 1.3 : flicker * 0.5;
    sl.ballMat.emissiveIntensity = 1.0 + flicker * 0.5;
    // Reset when too high
    if (sl.group.position.y > 90) {
      sl.group.position.y = 0.5;
      sl.group.position.x = (Math.random() - 0.5) * 20;
      sl.group.position.z = (Math.random() - 0.5) * 40;
    }
  });

  // Lotus gentle sway
  lotusFlowers.forEach(({ group, phase }) => {
    group.rotation.z = Math.sin(t * 0.5 + phase) * 0.04;
    group.rotation.x = Math.sin(t * 0.4 + phase + 1) * 0.03;
  });

  // Buddha halo pulse
  buddhaObj.haloMat.emissiveIntensity = 0.5 + 0.3 * Math.sin(t * 1.5);
  buddhaObj.divLight.intensity = 1.8 + 0.4 * Math.sin(t * 2);

  // Particles
  particleSystems.forEach(({ pts, pMat, positions, speeds }, si) => {
    const arr = positions.array;
    for (let i = 0; i < arr.length / 3; i++) {
      arr[i * 3 + 1] += speeds[i] * dt * (si === 1 ? 0.3 : 0.6);
      arr[i * 3] += Math.sin(t * 0.3 + i) * 0.01;
      if (arr[i * 3 + 1] > (si === 0 ? 8 : si === 1 ? 4 : 25)) arr[i * 3 + 1] = 0;
    }
    positions.needsUpdate = true;
    pMat.opacity = isNight ? 0.85 : 0.4;
  });

  // FPS
  frameCount++;
  if (t - fpsTime > 1) {
    document.getElementById('fps-counter').textContent = Math.round(frameCount / (t - fpsTime)) + ' FPS';
    frameCount = 0; fpsTime = t;
  }

  const cp = camera.position;
  document.getElementById('cam-pos').textContent = `Pos: ${cp.x.toFixed(1)}, ${cp.z.toFixed(1)}`;

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

// Resize
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// ─── LOADING SEQUENCE ──────────────────────────────────────────────────────
const loadFill = document.getElementById('load-fill');
const loading = document.getElementById('loading');
let pct = 0;
const loadInterval = setInterval(() => {
  pct += 8;
  loadFill.style.width = Math.min(pct, 100) + '%';
  if (pct >= 100) {
    clearInterval(loadInterval);
    setTimeout(() => {
      loading.style.opacity = '0';
      setTimeout(() => loading.style.display = 'none', 800);
      showToast('🪷 Welcome to Vesak AR City — Use arrow keys or buttons to walk');
    }, 200);
  }
}, 80);
</script>
