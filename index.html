<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 Advanced AR Vesak City with Thorana</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .ui { position: absolute; top: 10px; left: 10px; color: #ffddaa; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 12px; z-index: 1000; }
  </style>
</head>
<body>

  <div class="ui">
    <h2>🌕 Vesak City + Thorana</h2>
    <p>Move forward to reveal • Thorana glows at night</p>
  </div>

  <a-scene embedded arjs="sourceType: webcam;" webxr="requiredFeatures: hit-test;" background="color: #0a001f" fog="type: exponential; color: #0a001f; density: 0.03">

    <a-camera></a-camera>

    <!-- Lighting -->
    <a-light type="ambient" intensity="0.4" color="#445577"></a-light>
    <a-light type="directional" position="5 15 8" intensity="0.8" color="#ffddaa"></a-light>

    <!-- Ground -->
    <a-plane rotation="-90 0 0" width="80" height="80" color="#112211" opacity="0.75"></a-plane>

    <!-- Temple Center -->
    <a-entity gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Duck/glTF-Binary/Duck.glb" scale="6 6 6" position="0 0 -10"></a-entity>

    <!-- Buddha -->
    <a-entity gltf-model="https://assets.babylonjs.com/meshes/BoomBox.glb" scale="1.5 1.5 1.5" position="0 1.5 -15" rotation="0 180 0"></a-entity>

    <!-- Thorana (Main Arch) - REPLACE WITH YOUR MODEL -->
    <a-entity id="thorana" gltf-model="YOUR_THORANA_GLB_URL.glb" 
              scale="2.5 2.5 2.5" position="0 3 -22" rotation="0 0 0"
              visible="false"></a-entity>

    <!-- Vesak Lanterns -->
    <a-entity gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="1.8 1.8 1.8" position="-5 2 -8" animation="property: rotation; to: 0 360 0; dur: 12000; loop: true;"></a-entity>

    <!-- Flying Lanterns & Particles -->
    <a-entity position="0 5 -15" particle-system="preset: dust; color: #ffdd77; particleCount: 800"></a-entity>

  </a-scene>

  <script>
    // Progressive reveal
    const camera = document.querySelector('a-camera');
    setInterval(() => {
      const z = camera.object3D.position.z;
      if (z < -18) document.getElementById('thorana').setAttribute('visible', true);
    }, 400);
  </script>
</body>
</html>
