<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AR Vesak City</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: sans-serif; background: #0a0a1a; }

    #splash {
      position: absolute; inset: 0; z-index: 100;
      background: linear-gradient(180deg, #0a0a2a 0%, #1a0a3a 50%, #0d1a0d 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; text-align: center; padding: 2rem;
    }
    #splash h1 {
      font-size: 2rem; font-weight: 300; letter-spacing: 0.15em;
      color: #ffd700; margin-bottom: 0.5rem;
    }
    #splash .sub { font-size: 0.95rem; color: #c9b0ff; margin-bottom: 2.5rem; letter-spacing: 0.08em; }
    #splash .features {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 2.5rem;
    }
    #splash .feat {
      background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3);
      border-radius: 20px; padding: 6px 16px; font-size: 0.8rem; color: #ffd700;
    }
    #launch-btn {
      background: #ffd700; color: #1a0a3a; border: none; border-radius: 30px;
      padding: 14px 40px; font-size: 1rem; font-weight: 600; cursor: pointer;
      letter-spacing: 0.05em; transition: transform 0.2s;
    }
    #launch-btn:hover { transform: scale(1.05); }
    .lotus-deco { font-size: 2.5rem; margin-bottom: 1rem; }

    #mode-bar {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 50;
      background: rgba(10,10,26,0.85); backdrop-filter: blur(8px);
      display: none; padding: 12px 16px;
      flex-direction: row; align-items: center; justify-content: space-between; gap: 8px;
    }
    #mode-bar.visible { display: flex; }
    .mode-btn {
      flex: 1; background: rgba(255,215,0,0.12); border: 1px solid rgba(255,215,0,0.4);
      color: #ffd700; border-radius: 20px; padding: 8px 4px; font-size: 0.72rem;
      cursor: pointer; text-align: center; transition: background 0.2s;
    }
    .mode-btn.active { background: #ffd700; color: #1a0a3a; font-weight: 600; }
    .mode-btn:hover:not(.active) { background: rgba(255,215,0,0.22); }

    #info-toast {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(10,10,26,0.88); color: #ffd700; border: 1px solid rgba(255,215,0,0.4);
      border-radius: 20px; padding: 8px 20px; font-size: 0.8rem; z-index: 60;
      display: none; text-align: center; white-space: nowrap;
    }
    #info-toast.visible { display: block; }
  </style>
</head>
<body>

<div id="splash">
  <div class="lotus-deco">&#x1F338;</div>
  <h1>Vesak AR City</h1>
  <p class="sub">Suba Vesak Wewa &bull; Walk the Sacred Path</p>
  <div class="features">
    <span class="feat">Lotus Flower Path</span>
    <span class="feat">Buddha Statues</span>
    <span class="feat">Sri Lanka Stupa</span>
    <span class="feat">Vesak Lanterns</span>
    <span class="feat">Flying Lanterns</span>
    <span class="feat">AR + 3D Mode</span>
  </div>
  <button id="launch-btn" onclick="launchAR()">Enter Vesak City</button>
</div>

<div id="info-toast">Tap & drag to look around &bull; Walk forward to explore</div>
<div id="mode-bar">
  <div class="mode-btn active" id="btn-ar" onclick="setMode('ar')">AR Camera</div>
  <div class="mode-btn" id="btn-3d" onclick="setMode('3d')">3D Scene</div>
  <div class="mode-btn" id="btn-night" onclick="setMode('night')">Night Mode</div>
  <div class="mode-btn" id="btn-info" onclick="sendPrompt('Tell me about Vesak festival and these sacred places')">About Vesak ↗</div>
</div>

<a-scene
  id="main-scene"
  embedded
  style="display:none; width:100vw; height:100vh;"
  renderer="antialias: true; colorManagement: true;"
  loading-screen="enabled: false"
  vr-mode-ui="enabled: true"
  arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; displayWidth: 1280; displayHeight: 720;"
>

  <a-assets timeout="30000">
    <a-asset-item id="buddha1"  src="https://raw.githubusercontent.com/ThinukaVinjaya/vesakmodels/main/budha_statue.glb"></a-asset-item>
    <a-asset-item id="buddha2"  src="https://raw.githubusercontent.com/ThinukaVinjaya/vesakmodels/main/stone_buddha_statue.glb"></a-asset-item>
    <a-asset-item id="lotus1"   src="https://raw.githubusercontent.com/ThinukaVinjaya/vesakmodels/main/lotus1.glb"></a-asset-item>
    <a-asset-item id="lotus2"   src="https://raw.githubusercontent.com/ThinukaVinjaya/vesakmodels/main/lotus_flower2.glb"></a-asset-item>
    <a-asset-item id="lotuslan" src="https://raw.githubusercontent.com/ThinukaVinjaya/vesakmodels/main/lotus_lanttern.glb"></a-asset-item>
    <a-asset-item id="vesaklan" src="https://raw.githubusercontent.com/ThinukaVinjaya/vesakmodels/main/vesak_lanterns.glb"></a-asset-item>
    <a-asset-item id="stupa"    src="https://raw.githubusercontent.com/ThinukaVinjaya/vesakmodels/main/sthupa_srilanka.glb"></a-asset-item>
  </a-assets>

  <a-camera id="cam" look-controls="touchEnabled: true" wasd-controls="acceleration:20" position="0 1.6 0" fov="80">
    <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="near: 0.1; far: 50;"></a-entity>
  </a-camera>

  <!-- SKY -->
  <a-sky id="sky" color="#0a0a1e"></a-sky>

  <!-- STARS -->
  <a-entity id="stars" position="0 0 0"></a-entity>

  <!-- AMBIENT + DIRECTIONAL LIGHT -->
  <a-entity light="type: ambient; color: #b0a0ff; intensity: 0.6"></a-entity>
  <a-entity light="type: directional; color: #ffe4a0; intensity: 1.2" position="5 10 -5"></a-entity>
  <a-entity light="type: point; color: #ffd700; intensity: 0.8; distance: 30" position="0 4 -8"></a-entity>

  <!-- GROUND PLANE — stone path texture via color -->
  <a-plane id="ground" rotation="-90 0 0" width="60" height="80" color="#2a3d1a" position="0 0 -20"></a-plane>

  <!-- CENTRAL PATH — golden stone tiles -->
  <a-plane rotation="-90 0 0" width="4" height="80" color="#c8a85a" position="0 0.01 -20"
    material="roughness:0.9; metalness:0.1"></a-plane>
  <a-plane rotation="-90 0 0" width="3.6" height="80" color="#d4b870" position="0 0.015 -20"
    material="roughness:0.95"></a-plane>

  <!-- PATH EDGE LINES -->
  <a-box width="0.08" height="0.05" depth="80" color="#8B6914" position="-2 0.02 -20"></a-box>
  <a-box width="0.08" height="0.05" depth="80" color="#8B6914" position="2 0.02 -20"></a-box>

  <!-- =====================================================
       ZONE 1: ENTRANCE LOTUS PATH (z: 0 to -20)
       Lotus flowers line both sides of the path
  ====================================================== -->

  <!-- LEFT SIDE LOTUS FLOWERS (z-axis, alternating lotus1 and lotus2) -->
  <a-entity gltf-model="#lotus1" position="-3.5 0 -2"  scale="0.4 0.4 0.4" animation="property: rotation; to: 0 360 0; dur: 12000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus2" position="-3.5 0 -4"  scale="0.35 0.35 0.35" animation="property: rotation; to: 0 360 0; dur: 14000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus1" position="-4 0 -6"    scale="0.45 0.45 0.45" animation="property: rotation; to: 0 360 0; dur: 11000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus2" position="-3.5 0 -8"  scale="0.38 0.38 0.38" animation="property: rotation; to: 0 360 0; dur: 13000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus1" position="-4 0 -10"   scale="0.42 0.42 0.42" animation="property: rotation; to: 0 360 0; dur: 10000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus2" position="-3.5 0 -12" scale="0.36 0.36 0.36" animation="property: rotation; to: 0 360 0; dur: 15000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus1" position="-4 0 -14"   scale="0.44 0.44 0.44" animation="property: rotation; to: 0 360 0; dur: 12500; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus2" position="-3.5 0 -16" scale="0.37 0.37 0.37" animation="property: rotation; to: 0 360 0; dur: 11500; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus1" position="-4 0 -18"   scale="0.43 0.43 0.43" animation="property: rotation; to: 0 360 0; dur: 13500; loop: true; easing: linear"></a-entity>

  <!-- RIGHT SIDE LOTUS FLOWERS -->
  <a-entity gltf-model="#lotus2" position="3.5 0 -2"  scale="0.4 0.4 0.4" animation="property: rotation; to: 0 -360 0; dur: 12000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus1" position="3.5 0 -4"  scale="0.35 0.35 0.35" animation="property: rotation; to: 0 -360 0; dur: 14000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus2" position="4 0 -6"    scale="0.45 0.45 0.45" animation="property: rotation; to: 0 -360 0; dur: 11000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus1" position="3.5 0 -8"  scale="0.38 0.38 0.38" animation="property: rotation; to: 0 -360 0; dur: 13000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus2" position="4 0 -10"   scale="0.42 0.42 0.42" animation="property: rotation; to: 0 -360 0; dur: 10000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus1" position="3.5 0 -12" scale="0.36 0.36 0.36" animation="property: rotation; to: 0 -360 0; dur: 15000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus2" position="4 0 -14"   scale="0.44 0.44 0.44" animation="property: rotation; to: 0 -360 0; dur: 12500; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus1" position="3.5 0 -16" scale="0.37 0.37 0.37" animation="property: rotation; to: 0 -360 0; dur: 11500; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus2" position="4 0 -18"   scale="0.43 0.43 0.43" animation="property: rotation; to: 0 -360 0; dur: 13500; loop: true; easing: linear"></a-entity>

  <!-- EXTRA LOTUS CLUSTERS deeper in path edges (smaller fill-in) -->
  <a-entity gltf-model="#lotus1" position="-5 0 -3"  scale="0.25 0.25 0.25" animation="property: rotation; to: 0 360 0; dur: 9000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus2" position="-5 0 -7"  scale="0.22 0.22 0.22" animation="property: rotation; to: 0 360 0; dur: 16000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus1" position="-5 0 -11" scale="0.28 0.28 0.28" animation="property: rotation; to: 0 360 0; dur: 10500; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus2" position="5 0 -3"   scale="0.25 0.25 0.25" animation="property: rotation; to: 0 -360 0; dur: 9000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus1" position="5 0 -7"   scale="0.22 0.22 0.22" animation="property: rotation; to: 0 -360 0; dur: 16000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus2" position="5 0 -11"  scale="0.28 0.28 0.28" animation="property: rotation; to: 0 -360 0; dur: 10500; loop: true; easing: linear"></a-entity>

  <!-- LOTUS POND GLOW LIGHTS along path -->
  <a-entity light="type: point; color: #ff80b0; intensity: 0.4; distance: 5" position="-3.5 0.3 -5"></a-entity>
  <a-entity light="type: point; color: #ff80b0; intensity: 0.4; distance: 5" position="3.5 0.3 -5"></a-entity>
  <a-entity light="type: point; color: #ffb0d0; intensity: 0.35; distance: 5" position="-3.5 0.3 -12"></a-entity>
  <a-entity light="type: point; color: #ffb0d0; intensity: 0.35; distance: 5" position="3.5 0.3 -12"></a-entity>

  <!-- =====================================================
       ZONE 2: BUDDHA STATUE — LEFT SIDE (z: -20 to -28)
  ====================================================== -->

  <!-- Buddha pedestal / altar platform -->
  <a-box position="-6 0.3 -22" width="4" height="0.6" depth="4" color="#c8a040"
    material="roughness:0.8"></a-box>
  <a-box position="-6 0.65 -22" width="3.6" height="0.1" depth="3.6" color="#e8c060"
    material="roughness:0.6"></a-box>

  <!-- Main Buddha statue on pedestal -->
  <a-entity gltf-model="#buddha1" position="-6 0.7 -22" scale="1.2 1.2 1.2" rotation="0 90 0"></a-entity>

  <!-- Second smaller stone Buddha a bit further -->
  <a-entity gltf-model="#buddha2" position="-7 0 -27" scale="0.8 0.8 0.8" rotation="0 60 0"></a-entity>

  <!-- Small altar lotus beside buddha -->
  <a-entity gltf-model="#lotus1" position="-4.5 0.7 -21" scale="0.2 0.2 0.2" animation="property: rotation; to: 0 360 0; dur: 8000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus2" position="-7.5 0.7 -21" scale="0.2 0.2 0.2" animation="property: rotation; to: 0 360 0; dur: 9000; loop: true; easing: linear"></a-entity>

  <!-- Golden glow around buddha -->
  <a-entity light="type: point; color: #ffd700; intensity: 1.2; distance: 10" position="-6 2.5 -22"></a-entity>

  <!-- Incense smoke effect (rising particle-like spheres) -->
  <a-sphere position="-5.5 1.5 -22" radius="0.06" color="#fffce0" opacity="0.3"
    animation="property: position; to: -5.5 4 -22; dur: 4000; loop: true; easing: easeInQuad"
    animation__fade="property: material.opacity; from: 0.3; to: 0; dur: 4000; loop: true"></a-sphere>
  <a-sphere position="-6.5 1.5 -22" radius="0.05" color="#fffce0" opacity="0.25"
    animation="property: position; to: -6.5 3.8 -22; dur: 4500; loop: true; easing: easeInQuad; delay: 1000"
    animation__fade="property: material.opacity; from: 0.25; to: 0; dur: 4500; loop: true; delay: 1000"></a-sphere>

  <!-- Decorative flags / banners beside buddha -->
  <a-box position="-4 0 -20" width="0.08" height="5" depth="0.08" color="#8B4513"></a-box>
  <a-plane position="-4 4.5 -20" width="1.2" height="0.8" color="#ffd700" rotation="0 -90 0"></a-plane>
  <a-box position="-8 0 -20" width="0.08" height="5" depth="0.08" color="#8B4513"></a-box>
  <a-plane position="-8 4.5 -20" width="1.2" height="0.8" color="#e8336d" rotation="0 90 0"></a-plane>

  <!-- =====================================================
       ZONE 2: STUPA TEMPLE — RIGHT SIDE (z: -22 to -30)
  ====================================================== -->

  <!-- Stupa base platform (tiered) -->
  <a-box position="7 0.5 -24" width="8" height="1" depth="8" color="#c8b87a" material="roughness:0.9"></a-box>
  <a-box position="7 1.1 -24" width="6" height="0.3" depth="6" color="#d4c488" material="roughness:0.8"></a-box>
  <a-box position="7 1.4 -24" width="5" height="0.2" depth="5" color="#ddd098" material="roughness:0.7"></a-box>

  <!-- Main Stupa model -->
  <a-entity gltf-model="#stupa" position="7 1.6 -24" scale="1.5 1.5 1.5" rotation="0 -30 0"></a-entity>

  <!-- Stupa golden spire glow -->
  <a-entity light="type: point; color: #ffd700; intensity: 1.5; distance: 15" position="7 6 -24"></a-entity>

  <!-- Lotus pond around stupa base -->
  <a-entity gltf-model="#lotus1" position="4 1.6 -22" scale="0.3 0.3 0.3" animation="property: rotation; to: 0 360 0; dur: 10000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus2" position="10 1.6 -22" scale="0.28 0.28 0.28" animation="property: rotation; to: 0 -360 0; dur: 11000; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus1" position="4 1.6 -26" scale="0.3 0.3 0.3" animation="property: rotation; to: 0 360 0; dur: 9500; loop: true; easing: linear"></a-entity>
  <a-entity gltf-model="#lotus2" position="10 1.6 -26" scale="0.28 0.28 0.28" animation="property: rotation; to: 0 -360 0; dur: 12000; loop: true; easing: linear"></a-entity>

  <!-- Prayer flags on stupa area -->
  <a-box position="4 0 -22"  width="0.06" height="6" depth="0.06" color="#8B4513"></a-box>
  <a-box position="10 0 -22" width="0.06" height="6" depth="0.06" color="#8B4513"></a-box>
  <a-box position="4 0 -26"  width="0.06" height="6" depth="0.06" color="#8B4513"></a-box>
  <a-box position="10 0 -26" width="0.06" height="6" depth="0.06" color="#8B4513"></a-box>
  <!-- Flag ropes (simulated with thin boxes) -->
  <a-box position="7 5.8 -22" width="6.5" height="0.04" depth="0.04" color="#ffd700"></a-box>
  <a-box position="7 5.5 -22" width="6.5" height="0.04" depth="0.04" color="#e8336d"></a-box>

  <!-- =====================================================
       ZONE 3: VESAK LANTERNS — BOTH SIDES OF PATH (z: -28 to -50)
  ====================================================== -->

  <!-- LEFT SIDE VESAK LANTERNS on poles -->
  <a-box position="-2.8 0 -28" width="0.1" height="3.5" depth="0.1" color="#6B4423"></a-box>
  <a-entity gltf-model="#vesaklan" position="-2.8 3.5 -28" scale="0.5 0.5 0.5"
    animation="property: rotation; to: 0 360 0; dur: 8000; loop: true; easing: linear"></a-entity>
  <a-entity light="type: point; color: #ffaa00; intensity: 0.6; distance: 6" position="-2.8 3.5 -28"></a-entity>

  <a-box position="-2.8 0 -32" width="0.1" height="3.5" depth="0.1" color="#6B4423"></a-box>
  <a-entity gltf-model="#lotuslan" position="-2.8 3.5 -32" scale="0.5 0.5 0.5"
    animation="property: rotation; to: 0 360 0; dur: 9000; loop: true; easing: linear"></a-entity>
  <a-entity light="type: point; color: #ff6688; intensity: 0.6; distance: 6" position="-2.8 3.5 -32"></a-entity>

  <a-box position="-2.8 0 -36" width="0.1" height="3.5" depth="0.1" color="#6B4423"></a-box>
  <a-entity gltf-model="#vesaklan" position="-2.8 3.5 -36" scale="0.5 0.5 0.5"
    animation="property: rotation; to: 0 360 0; dur: 7500; loop: true; easing: linear"></a-entity>
  <a-entity light="type: point; color: #ffaa00; intensity: 0.6; distance: 6" position="-2.8 3.5 -36"></a-entity>

  <a-box position="-2.8 0 -40" width="0.1" height="3.5" depth="0.1" color="#6B4423"></a-box>
  <a-entity gltf-model="#lotuslan" position="-2.8 3.5 -40" scale="0.5 0.5 0.5"
    animation="property: rotation; to: 0 -360 0; dur: 10000; loop: true; easing: linear"></a-entity>
  <a-entity light="type: point; color: #ff6688; intensity: 0.6; distance: 6" position="-2.8 3.5 -40"></a-entity>

  <a-box position="-2.8 0 -44" width="0.1" height="3.5" depth="0.1" color="#6B4423"></a-box>
  <a-entity gltf-model="#vesaklan" position="-2.8 3.5 -44" scale="0.5 0.5 0.5"
    animation="property: rotation; to: 0 360 0; dur: 8500; loop: true; easing: linear"></a-entity>
  <a-entity light="type: point; color: #ffaa00; intensity: 0.6; distance: 6" position="-2.8 3.5 -44"></a-entity>

  <!-- RIGHT SIDE VESAK LANTERNS on poles -->
  <a-box position="2.8 0 -28" width="0.1" height="3.5" depth="0.1" color="#6B4423"></a-box>
  <a-entity gltf-model="#lotuslan" position="2.8 3.5 -28" scale="0.5 0.5 0.5"
    animation="property: rotation; to: 0 -360 0; dur: 8000; loop: true; easing: linear"></a-entity>
  <a-entity light="type: point; color: #ff6688; intensity: 0.6; distance: 6" position="2.8 3.5 -28"></a-entity>

  <a-box position="2.8 0 -32" width="0.1" height="3.5" depth="0.1" color="#6B4423"></a-box>
  <a-entity gltf-model="#vesaklan" position="2.8 3.5 -32" scale="0.5 0.5 0.5"
    animation="property: rotation; to: 0 360 0; dur: 9000; loop: true; easing: linear"></a-entity>
  <a-entity light="type: point; color: #ffaa00; intensity: 0.6; distance: 6" position="2.8 3.5 -32"></a-entity>

  <a-box position="2.8 0 -36" width="0.1" height="3.5" depth="0.1" color="#6B4423"></a-box>
  <a-entity gltf-model="#lotuslan" position="2.8 3.5 -36" scale="0.5 0.5 0.5"
    animation="property: rotation; to: 0 -360 0; dur: 7500; loop: true; easing: linear"></a-entity>
  <a-entity light="type: point; color: #ff6688; intensity: 0.6; distance: 6" position="2.8 3.5 -36"></a-entity>

  <a-box position="2.8 0 -40" width="0.1" height="3.5" depth="0.1" color="#6B4423"></a-box>
  <a-entity gltf-model="#vesaklan" position="2.8 3.5 -40" scale="0.5 0.5 0.5"
    animation="property: rotation; to: 0 360 0; dur: 10000; loop: true; easing: linear"></a-entity>
  <a-entity light="type: point; color: #ffaa00; intensity: 0.6; distance: 6" position="2.8 3.5 -40"></a-entity>

  <a-box position="2.8 0 -44" width="0.1" height="3.5" depth="0.1" color="#6B4423"></a-box>
  <a-entity gltf-model="#lotuslan" position="2.8 3.5 -44" scale="0.5 0.5 0.5"
    animation="property: rotation; to: 0 -360 0; dur: 8500; loop: true; easing: linear"></a-entity>
  <a-entity light="type: point; color: #ff6688; intensity: 0.6; distance: 6" position="2.8 3.5 -44"></a-entity>

  <!-- =====================================================
       ZONE 4: FLYING SKY LANTERNS — Rise into the sky
       Built from geometry (no model needed) — warm glowing
       rice-paper lanterns with flame inside
  ====================================================== -->

  <!-- Flying lantern = cylinder body + cone top + cone bottom + inner glow sphere -->
  <!-- Lantern 1 -->
  <a-entity id="fly1" position="-4 2 -30"
    animation="property: position; from: -4 2 -30; to: -5 22 -30; dur: 12000; loop: true; easing: easeInOutSine; dir: alternate">

<script>
  var currentMode = 'ar';

  function launchAR() {
    document.getElementById('splash').style.display = 'none';
    var scene = document.getElementById('main-scene');
    scene.style.display = 'block';
    document.getElementById('mode-bar').classList.add('visible');

    var toast = document.getElementById('info-toast');
    toast.classList.add('visible');
    setTimeout(function() { toast.classList.remove('visible'); }, 4000);

    buildStars();
  }

  function buildStars() {
    var stars = document.getElementById('stars');
    for (var i = 0; i < 200; i++) {
      var s = document.createElement('a-sphere');
      var x = (Math.random() - 0.5) * 120;
      var y = 8 + Math.random() * 40;
      var z = -10 - Math.random() * 80;
      s.setAttribute('position', x + ' ' + y + ' ' + z);
      var r = 0.03 + Math.random() * 0.04;
      s.setAttribute('radius', r.toFixed(2));
      s.setAttribute('color', '#ffffff');
      s.setAttribute('material', 'emissive:#ffffff; emissiveIntensity:' + (0.5 + Math.random() * 0.5).toFixed(1));
      stars.appendChild(s);
    }
  }

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });

    var scene = document.getElementById('main-scene');
    var sky = document.getElementById('sky');
    var cam = document.getElementById('cam');

    if (mode === 'ar') {
      document.getElementById('btn-ar').classList.add('active');
      sky.setAttribute('color', '#0a0a1e');
      scene.setAttribute('arjs', 'trackingMethod: best; sourceType: webcam; debugUIEnabled: false;');
    } else if (mode === '3d') {
      document.getElementById('btn-3d').classList.add('active');
      sky.setAttribute('color', '#1a0a2e');
      scene.removeAttribute('arjs');
      cam.setAttribute('position', '0 1.6 2');
    } else if (mode === 'night') {
      document.getElementById('btn-night').classList.add('active');
      sky.setAttribute('color', '#050510');
    }
  }
</script>
