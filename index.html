<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AR Vesak City</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/webxr/ARButton.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js';

let camera, scene, renderer;
let loader = new GLTFLoader();

init();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;

  document.body.appendChild(renderer.domElement);
  document.body.appendChild(ARButton.createButton(renderer));

  // Light
  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
  scene.add(light);

  // Load Models
  loadModels();

  renderer.setAnimationLoop(render);
}

function loadModels() {

  const center = new THREE.Vector3(0, 0, -2);

  // STUPA (CENTER)
  loader.load('RAW_STHUPA_URL', (gltf) => {
    let stupa = gltf.scene;
    stupa.scale.set(2,2,2);
    stupa.position.copy(center);
    scene.add(stupa);
  });

  // BUDDHA (LEFT)
  loader.load('RAW_BUDDHA_URL', (gltf) => {
    let buddha = gltf.scene;
    buddha.position.set(-1.5, 0, -2);
    scene.add(buddha);
  });

  // LOTUS FLOWERS (GROUND + RIGHT SIDE DENSE)
  for (let i = 0; i < 50; i++) {
    loader.load('RAW_LOTUS_URL', (gltf) => {
      let lotus = gltf.scene;

      let x = Math.random() * 4 - 2;
      let z = Math.random() * 4 - 2;

      // MORE ON RIGHT SIDE
      if (Math.random() > 0.5) x += 1.5;

      lotus.position.set(x, 0, z - 2);
      lotus.scale.setScalar(Math.random() * 0.5 + 0.5);

      scene.add(lotus);
    });
  }

  // LANTERNS (FLOATING)
  for (let i = 0; i < 10; i++) {
    loader.load('RAW_LANTERN_URL', (gltf) => {
      let lantern = gltf.scene;

      lantern.position.set(
        Math.random() * 3 - 1.5,
        Math.random() * 1 + 1,
        Math.random() * 3 - 2
      );

      scene.add(lantern);
    });
  }
}

function render() {
  renderer.render(scene, camera);
}

</script>
</body>
</html>
