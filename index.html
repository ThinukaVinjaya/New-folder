<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 Optimized AR Vesak City</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    .ui {
      position: absolute; top: 10px; left: 10px; color: #ffddaa; 
      background: rgba(0,0,0,0.5); padding: 10px 15px; border-radius: 8px; 
      z-index: 1000; font-family: Arial; font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="ui">
    <h2>🌕 Optimized Vesak City</h2>
    <p>Real Camera • Move slowly</p>
  </div>

  <a-scene 
    embedded 
    renderer="alpha: true; antialias: true; precision: mediump;"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false; trackingMethod: best;"
    background="color: transparent"
    stats="true">   <!-- Remove stats="true" in production -->

    <a-camera></a-camera>

    <!-- Optimized Lighting -->
    <a-light type="ambient" intensity="0.75" color="#ffffff"></a-light>
    <a-light type="directional" position="5 10 5" intensity="0.9" color="#ffeedd"></a-light>

    <!-- Minimal ground -->
    <a-plane rotation="-90 0 0" width="60" height="60" color="#112211" opacity="0.1"></a-plane>

    <!-- Temple (Main heavy model) -->
    <a-entity id="temple" 
              gltf-model="YOUR_TEMPLE.glb" 
              scale="5 5 5" position="0 0 -8" visible="false"></a-entity>

    <!-- Buddha -->
    <a-entity id="buddha" 
              gltf-model="YOUR_BUDDHA.glb" 
              scale="1.4 1.4 1.4" position="0 1 -13" rotation="0 180 0" visible="false"></a-entity>

    <!-- Thorana -->
    <a-entity id="thorana" 
              gltf-model="YOUR_THORANA.glb" 
              scale="2.5 2.5 2.5" position="0 3.5 -20" visible="false"></a-entity>

    <!-- Reused Lantern (better performance) -->
    <a-entity class="lantern" 
              gltf-model="YOUR_LANTERN.glb" 
              scale="1.4 1.4 1.4" position="-4 1.8 -7" 
              animation="property: rotation; to: 0 360 0; dur: 16000; loop: true;" visible="false"></a-entity>

    <a-entity class="lantern" 
              gltf-model="YOUR_LANTERN.glb" 
              scale="1.3 1.3 1.3" position="4 1.9 -9" 
              animation="property: rotation; to: 0 360 0; dur: 18000; loop: true;" visible="false"></a-entity>

    <!-- Optimized Particles (Fireflies) -->
    <a-entity position="0 4 -10" 
              particle-system="preset: dust; color: #ffdd77; particleCount: 250; size: 0.04; velocity: 0.1 0.2 0.1"></a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const camera = document.querySelector('a-camera');

    let lastCheck = 0;

    function revealModels() {
      const now = Date.now();
      if (now - lastCheck < 300) return; // Throttle to 300ms
      lastCheck = now;

      const z = camera.object3D.position.z;

      if (z < -5) document.getElementById('temple').setAttribute('visible', true);
      if (z < -11) document.getElementById('buddha').setAttribute('visible', true);
      if (z < -17) {
        document.getElementById('thorana').setAttribute('visible', true);
        document.querySelectorAll('.lantern').forEach(l => l.setAttribute('visible', true));
      }
    }

    scene.addEventListener('loaded', () => {
      setInterval(revealModels, 100);
    });

    // Tap to place extra lantern (optimized)
    scene.addEventListener('click', () => {
      const lantern = document.createElement('a-entity');
      lantern.setAttribute('gltf-model', 'YOUR_LANTERN.glb');
      lantern.setAttribute('scale', '1.2 1.2 1.2');
      lantern.setAttribute('animation', 'property: rotation; to: 0 360 0; dur: 14000; loop: true');
      scene.appendChild(lantern);
    });
  </script>

  <button onclick="document.querySelector('a-scene').enterVR()" 
          style="position:fixed; bottom:25px; left:25px; z-index:10000; padding:14px 22px; font-size:16px; background:#ffcc00; color:black; border:none; border-radius:10px;">
    📱 Start Optimized AR
  </button>
</body>
</html>
