<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 Advanced Vesak City - WebXR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    .ui {
      position: absolute; top: 10px; left: 10px; color: #ffddaa; 
      background: rgba(0,0,0,0.7); padding: 15px; border-radius: 12px; z-index: 1000;
    }
    button {
      position: fixed; bottom: 20px; left: 20px; z-index: 10000;
      padding: 15px 28px; font-size: 18px; background: #ffcc00; color: black;
      border: none; border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="ui">
    <h2>🌕 Advanced Vesak City</h2>
    <p>Walk forward between lotus path • Tap to add lanterns</p>
  </div>

  <a-scene background="color: #0a001f" xr-mode-ui="enabled: true">

    <a-camera></a-camera>

    <!-- Lighting -->
    <a-light type="ambient" intensity="0.45" color="#445577"></a-light>
    <a-light type="directional" position="5 15 10" intensity="0.9" color="#ffddbb"></a-light>

    <!-- Ground -->
    <a-plane rotation="-90 0 0" width="100" height="100" color="#001a00" opacity="0.35"></a-plane>

    <!-- ====================== LOTUS PATH ====================== -->
    <!-- Left Side Lotus Path -->
    <a-entity position="-4 0.2 -8" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" scale="1.2 1.2 1.2"></a-entity>
    <a-entity position="-4 0.2 -14" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" scale="1.2 1.2 1.2"></a-entity>
    <a-entity position="-4 0.2 -20" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" scale="1.2 1.2 1.2"></a-entity>
    <a-entity position="-4 0.2 -26" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" scale="1.2 1.2 1.2"></a-entity>

    <!-- Right Side Lotus Path -->
    <a-entity position="4 0.2 -8" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" scale="1.2 1.2 1.2"></a-entity>
    <a-entity position="4 0.2 -14" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" scale="1.2 1.2 1.2"></a-entity>
    <a-entity position="4 0.2 -20" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" scale="1.2 1.2 1.2"></a-entity>
    <a-entity position="4 0.2 -26" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" scale="1.2 1.2 1.2"></a-entity>

    <!-- ====================== MAIN ELEMENTS ====================== -->

    <!-- Temple - Right Side -->
    <a-entity gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Duck/glTF-Binary/Duck.glb"
              scale="10 10 10" position="12 0 -22" rotation="0 45 0"></a-entity>

    <!-- Buddha Statue - Left Side -->
    <a-entity gltf-model="https://assets.babylonjs.com/meshes/BoomBox.glb"
              scale="2.5 2.5 2.5" position="-12 2 -20" rotation="0 200 0"></a-entity>

    <!-- Vesak Lanterns along the path -->
    <a-entity class="lantern" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb"
              scale="1.8 1.8 1.8" position="-2 2 -10" animation="property: rotation; to: 0 360 0; dur: 14000; loop: true;"></a-entity>
    
    <a-entity class="lantern" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb"
              scale="1.7 1.7 1.7" position="3 2 -15" animation="property: rotation; to: 0 360 0; dur: 16000; loop: true;"></a-entity>

    <a-entity class="lantern" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb"
              scale="1.8 1.8 1.8" position="-2.5 2 -23" animation="property: rotation; to: 0 360 0; dur: 13000; loop: true;"></a-entity>

    <!-- Flying Vesak Lanterns -->
    <a-entity gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb"
              scale="1.1 1.1 1.1" position="-6 3 -18"
              animation="property: position; to: -8 25 -25; dur: 28000; loop: false;"></a-entity>

    <a-entity gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb"
              scale="0.9 0.9 0.9" position="5 4 -22"
              animation="property: position; to: 7 28 -30; dur: 32000; loop: false;"></a-entity>

    <!-- Fireflies -->
    <a-entity position="0 6 -15" particle-system="preset: dust; color: #ffdd77,#ffeeaa; particleCount: 500; size: 0.06"></a-entity>

  </a-scene>

  <button onclick="startAR()">📱 Start Advanced Vesak City</button>

  <script>
    function startAR() {
      const scene = document.querySelector('a-scene');
      scene.enterVR('immersive-ar');
    }

    // Tap screen to place extra lantern
    document.querySelector('a-scene').addEventListener('click', () => {
      const lantern = document.createElement('a-entity');
      lantern.setAttribute('gltf-model', 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb');
      lantern.setAttribute('scale', '1.6 1.6 1.6');
      lantern.setAttribute('animation', 'property: rotation; to: 0 360 0; dur: 14000; loop: true');
      document.querySelector('a-scene').appendChild(lantern);
    });
  </script>
</body>
</html>
