<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vesak AR City — Real Camera</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a14; font-family: 'Georgia', serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; }
  /* Keep all your original CSS */
  #ui, #legend, #controls, #loading, #info-toast { /* your styles */ }
</style>
</head>
<body>

<!-- Your original HTML remains the same -->
<div id="loading">...</div>
<canvas id="canvas"></canvas>
<div id="ui">...</div>
<div id="legend">...</div>
<div id="controls">
  <!-- ... your buttons ... -->
  <button class="btn xr-btn" id="xr-btn">📱 Start AR Camera</button>
</div>
<div id="info-toast"></div>

<script>
// ─── SCENE SETUP (Your code) ─────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ 
  canvas: document.getElementById('canvas'), 
  antialias: true, 
  alpha: true 
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.xr.enabled = true;           // ← Important for AR

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a1f, 0.018);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 300);

// [Keep all your buildSky(), buildGround(), buildLotus(), buildTemple(), buildBuddha(), etc. functions exactly as they are]

// ... (All your scene building code - lotus, lanterns, temple, buddha, sky lanterns, etc.) ...

// ─── WEBXR AR SUPPORT ─────────────────────────────────────────────────────
async function startAR() {
  if (!('xr' in navigator)) {
    showToast("WebXR not supported on this device");
    return;
  }

  try {
    const supported = await navigator.xr.isSessionSupported('immersive-ar');
    if (!supported) {
      showToast("AR not supported on this device");
      return;
    }

    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.getElementById('controls') }
    });

    renderer.xr.setSession(session);
    showToast('🪷 AR Camera Activated! Tap on floor to place lanterns.');

    document.getElementById('mode-label').textContent = '● AR Active';

  } catch (err) {
    console.error(err);
    showToast('Failed to start AR: ' + err.message);
  }
}

// Add extra lantern when tapping in AR
renderer.xr.addEventListener('sessionstart', () => {
  const session = renderer.xr.getSession();
  session.addEventListener('select', () => {
    const lantern = createSimpleLantern();
    scene.add(lantern);
    showToast('Vesak Lantern Placed ✨');
  });
});

function createSimpleLantern() {
  const group = new THREE.Group();
  const geo = new THREE.SphereGeometry(0.6, 16, 16);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffaa33,
    emissive: 0xff5500,
    emissiveIntensity: 2.5
  });
  const mesh = new THREE.Mesh(geo, mat);
  group.add(mesh);

  const light = new THREE.PointLight(0xffaa33, 3, 10);
  group.add(light);
  return group;
}

// Connect button
document.getElementById('xr-btn').addEventListener('click', startAR);

// Keep your original animate function
renderer.setAnimationLoop((time, frame) => {
  // Your original animation logic
  animate(time);
});

// Resize handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
