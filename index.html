<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Test - Can You See the Box?</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .info {
      position: absolute; top: 10px; left: 10px; color: white; 
      background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; z-index: 100;
    }
  </style>
</head>
<body>

  <div class="info">
    <h2>AR Test</h2>
    <p>Point at floor → You should see a big RED box</p>
  </div>

  <a-scene 
    embedded 
    arjs="sourceType: webcam; videoTexture: true;"
    renderer="alpha: true"
    background="color: transparent">

    <a-camera></a-camera>

    <!-- Big colorful box for testing -->
    <a-box position="0 0.5 -3" rotation="0 30 0" color="#ff0000" height="1" width="1" depth="1" visible="true"></a-box>

    <!-- Big glowing sphere -->
    <a-sphere position="2 1 -4" radius="0.6" color="#00ff00" visible="true"></a-sphere>

  </a-scene>

  <button onclick="document.querySelector('a-scene').enterVR()" 
          style="position:fixed; bottom:30px; left:30px; z-index:1000; padding:15px 25px; font-size:18px; background:#ffcc00; border:none; border-radius:10px;">
    📱 Start AR
  </button>

</body>
</html>
