<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR Vesak City</title>
    <style>
      body { margin: 0; font-family: sans-serif; overflow: hidden; }
      #overlay { position: absolute; left: 10px; top: 10px; z-index: 2; color: #fff; }
      #startHint { background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="overlay"><div id="startHint">Tap the AR button and then tap the reticle to place the Vesak city.</div></div>
    <script type="module">
      import * as THREE from 'https://unpkg.com/three@0.150.1/build/three.module.js';
      import { ARButton } from 'https://unpkg.com/three@0.150.1/examples/jsm/webxr/ARButton.js';

      let camera, scene, renderer;
      let controller;
      let reticle;
      let world = null;
      let hitTestSource = null;
      let hitTestSourceRequested = false;

      init();
      animate();

      function init() {
        const container = document.createElement('div');
        document.body.appendChild(container);

        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        container.appendChild(renderer.domElement);

        document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

        // light
        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        light.position.set(0.5, 1, 0.25);
        scene.add(light);

        // Reticle for placement
        reticle = new THREE.Mesh(
          new THREE.RingGeometry(0.12, 0.15, 32).rotateX(-Math.PI / 2),
          new THREE.MeshBasicMaterial({ color: 0x00ffcc })
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        // controller to handle input
        controller = renderer.xr.getController(0);
        controller.addEventListener('select', onSelect);
        scene.add(controller);

        window.addEventListener('resize', onWindowResize);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function onSelect() {
        if (reticle.visible && !world) {
          placeWorldAtReticle();
        }
      }

      function placeWorldAtReticle() {
        world = new THREE.Group();
        world.position.setFromMatrixPosition(reticle.matrix);
        world.quaternion.setFromRotationMatrix(reticle.matrix);
        scene.add(world);

        // Add a forward path of lotus flowers on both sides
        addLotusPath(world, 8, 6, 0.6); // length, sideOffset, spacing

        // Place temple on the right
        const temple = createTemple();
        temple.position.set(3.5, 0, -4);
        world.add(temple);

        // Place Buddha statue on the left
        const buddha = createBuddha();
        buddha.position.set(-3.5, 0, -4);
        world.add(buddha);

        // Add lanterns along paths and some flying lanterns
        addPathLanterns(world, 6);
        addFlyingLanterns(world, 10);

        document.getElementById('startHint').style.display = 'none';
      }

      function addLotusPath(root, length = 8, sideOffset = 6, spacing = 0.6) {
        const leftGroup = new THREE.Group();
        const rightGroup = new THREE.Group();

        for (let i = 0; i < length; i++) {
          const z = -i * spacing - 0.5;
          const left = createLotusFlower();
          left.position.set(-sideOffset, 0, z);
          left.scale.setScalar(0.6 + Math.random() * 0.4);
          leftGroup.add(left);

          const right = createLotusFlower();
          right.position.set(sideOffset, 0, z - (Math.random() * 0.2));
          right.scale.setScalar(0.6 + Math.random() * 0.4);
          rightGroup.add(right);
        }

        root.add(leftGroup);
        root.add(rightGroup);
      }

      function createLotusFlower() {
        const group = new THREE.Group();
        const petalMat = new THREE.MeshStandardMaterial({ color: 0xff66aa, roughness: 0.6 });
        for (let i = 0; i < 8; i++) {
          const petal = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.6, 6), petalMat);
          petal.position.y = 0.12;
          petal.rotation.x = Math.PI / 2;
          petal.rotation.z = (i / 8) * Math.PI * 2;
          petal.scale.set(1, 1, 0.4);
          group.add(petal);
        }
        const center = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffdd55 }));
        center.position.y = 0.08;
        group.add(center);
        return group;
      }

      function createTemple() {
        const g = new THREE.Group();
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x880000 });

        const base = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.6, 3), baseMat);
        base.position.y = 0.3;
        g.add(base);

        const pillars = new THREE.Group();
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0xd9c8a6 });
        for (let i = -1; i <= 1; i += 2) {
          for (let j = -1; j <= 1; j += 2) {
            const p = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2), pillarMat);
            p.position.set(i * 1.0, 0.9, j * 1.1);
            pillars.add(p);
          }
        }
        g.add(pillars);

        const roof = new THREE.Mesh(new THREE.ConeGeometry(1.6, 1.2, 4), roofMat);
        roof.position.y = 1.3;
        roof.rotation.y = Math.PI / 4;
        g.add(roof);

        return g;
      }

      function createBuddha() {
        const g = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0xfff3d7 });
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 12), mat);
        body.position.y = 0.8;
        g.add(body);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 10), mat);
        head.position.set(0, 1.4, 0);
        g.add(head);

        const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.25), new THREE.MeshStandardMaterial({ color: 0x705032 }));
        pedestal.position.y = 0.125;
        g.add(pedestal);

        return g;
      }

      function addPathLanterns(root, count = 6) {
        const lanterns = new THREE.Group();
        for (let i = 0; i < count; i++) {
          const z = -i * 0.9 - 0.5;
          const left = createLantern();
          left.position.set(-2.5, 0.5, z);
          lanterns.add(left);

          const right = createLantern();
          right.position.set(2.5, 0.5, z - 0.1);
          lanterns.add(right);
        }
        root.add(lanterns);
      }

      function createLantern() {
        const g = new THREE.Group();
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 8), new THREE.MeshStandardMaterial({ emissive: 0xffaa33, emissiveIntensity: 1, color: 0x330000 }));
        bulb.position.y = 0.15;
        g.add(bulb);

        const cage = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.03, 8, 24), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        cage.rotation.x = Math.PI / 2;
        cage.position.y = 0.15;
        g.add(cage);

        return g;
      }

      let flyingLanterns = [];
      function addFlyingLanterns(root, count = 10) {
        const group = new THREE.Group();
        for (let i = 0; i < count; i++) {
          const lantern = createLantern();
          lantern.position.set((Math.random() - 0.5) * 4, 0.2 + Math.random() * 0.6, -1 - Math.random() * 5);
          lantern.userData = { vy: 0.01 + Math.random() * 0.02, rot: Math.random() * 0.02 };
          flyingLanterns.push(lantern);
          group.add(lantern);
        }
        root.add(group);
      }

      // Animation loop
      function animate() {
        renderer.setAnimationLoop(render);
      }

      function render(timestamp, frame) {
        if (frame) {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const session = renderer.xr.getSession();

          if (!hitTestSourceRequested) {
            session.requestReferenceSpace('viewer').then(function (refSpace) {
              session.requestHitTestSource({ space: refSpace }).then(function (source) {
                hitTestSource = source;
              });
            });

            session.addEventListener('end', function () {
              hitTestSourceRequested = false;
              hitTestSource = null;
            });

            hitTestSourceRequested = true;
          }

          if (hitTestSource) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length) {
              const hit = hitTestResults[0];
              const pose = hit.getPose(referenceSpace);
              reticle.visible = true;
              reticle.matrix.fromArray(pose.transform.matrix);
            } else {
              reticle.visible = false;
            }
          }
        }

        // update flying lanterns
        for (const fl of flyingLanterns) {
          fl.position.y += fl.userData.vy;
          fl.position.x += Math.sin(timestamp * 0.001 + fl.userData.rot) * 0.0005;
          fl.position.z -= 0.002; // slowly move away/upward
          fl.rotation.y += 0.002;
        }

        renderer.render(scene, camera);
      }

    </script>
  </body>
</html>
