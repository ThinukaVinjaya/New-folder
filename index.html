<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 Realistic AR Vesak City</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    .ui {
      position: absolute; top: 10px; left: 10px; color: #ffddaa; 
      background: rgba(0,0,0,0.7); padding: 15px; border-radius: 12px; 
      z-index: 1000; font-family: Arial;
    }
    .controls {
      position: fixed; bottom: 20px; left: 20px; z-index: 10000;
    }
    button {
      padding: 14px 24px; margin: 5px; font-size: 17px; border: none; 
      border-radius: 12px; background: #ffcc00; color: black;
    }
  </style>
</head>
<body>

  <div class="ui">
    <h2>🌕 Realistic Vesak City</h2>
    <p>Move forward slowly • Tap to add lanterns</p>
  </div>

  <a-scene 
    background="color: #0a001f"
    xr-mode-ui="enabled: true">

    <a-camera></a-camera>

    <!-- Realistic Night Lighting -->
    <a-light type="ambient" intensity="0.4" color="#445577"></a-light>
    <a-light type="directional" position="8 15 10" intensity="0.85" color="#ffddbb"></a-light>

    <!-- Large Ground -->
    <a-plane rotation="-90 0 0" width="200" height="200" color="#001a00" opacity="0.3"></a-plane>

    <!-- ====================== MAIN CITY ====================== -->

    <!-- Temple (Far Center) -->
    <a-entity gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Duck/glTF-Binary/Duck.glb" 
              scale="9 9 9" position="0 0 -18" rotation="0 30 0"></a-entity>

    <!-- Buddha Statue -->
    <a-entity gltf-model="https://assets.babylonjs.com/meshes/BoomBox.glb" 
              scale="2.2 2.2 2.2" position="0 2 -14" rotation="0 180 0"></a-entity>

    <!-- Thorana (Large Arch - farther) -->
    <a-entity gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="4 4 4" position="0 6 -26" rotation="0 0 0"></a-entity>

    <!-- Multiple Vesak Lanterns (Spread out) -->
    <a-entity class="lantern" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="1.8 1.8 1.8" position="-6 2 -10" 
              animation="property: rotation; to: 0 360 0; dur: 16000; loop: true;"></a-entity>

    <a-entity class="lantern" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="1.7 1.7 1.7" position="7 2.2 -12" 
              animation="property: rotation; to: 0 360 0; dur: 18000; loop: true;"></a-entity>

    <a-entity class="lantern" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="1.6 1.6 1.6" position="-8 2.5 -20" 
              animation="property: rotation; to: 0 360 0; dur: 14000; loop: true;"></a-entity>

    <!-- Flying Lanterns -->
    <a-entity class="flying" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="1 1 1" position="-5 4 -22" 
              animation="property: position; to: -5 15 -22; dur: 35000; loop: false;"></a-entity>

    <a-entity class="flying" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="0.9 0.9 0.9" position="6 3.5 -24" 
              animation="property: position; to: 6 14 -24; dur: 32000; loop: false;"></a-entity>

    <!-- Fireflies / Light Particles -->
    <a-entity position="0 6 -15" particle-system="preset: dust; color: #ffdd77,#ffeeaa; particleCount: 450; size: 0.05"></a-entity>

  </a-scene>

  <div class="controls">
    <button onclick="startAR()">📱 Start Realistic AR</button>
    <button onclick="addLantern()">➕ Add Lantern</button>
  </div>

  <script>
    function startAR() {
      const scene = document.querySelector('a-scene');
      scene.enterVR('immersive-ar');
    }

    function addLantern() {
      const scene = document.querySelector('a-scene');
      const lantern = document.createElement('a-entity');
      lantern.setAttribute('gltf-model', 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb');
      lantern.setAttribute('scale', '1.5 1.5 1.5');
      lantern.setAttribute('animation', 'property: rotation; to: 0 360 0; dur: 14000; loop: true');
      scene.appendChild(lantern);
    }
  </script>
</body>
</html>
