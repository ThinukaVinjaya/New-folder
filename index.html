<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 My Vesak City - WebXR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    .ui {
      position: absolute; top: 10px; left: 10px; color: #ffddaa; 
      background: rgba(0,0,0,0.7); padding: 15px; border-radius: 12px; 
      z-index: 1000; font-family: Arial;
    }
    .controls {
      position: fixed; bottom: 20px; left: 20px; z-index: 10000;
    }
    button {
      padding: 14px 24px; margin: 5px; font-size: 17px; border: none; 
      border-radius: 12px; background: #ffcc00; color: black;
    }
  </style>
</head>
<body>

  <div class="ui">
    <h2>🌕 My AR Vesak City</h2>
    <p>Point at floor → Tap to place more lanterns</p>
  </div>

  <a-scene 
    background="color: #0a001f"
    xr-mode-ui="enabled: true">

    <a-camera></a-camera>

    <!-- Realistic Night Lighting -->
    <a-light type="ambient" intensity="0.45" color="#445577"></a-light>
    <a-light type="directional" position="5 12 8" intensity="0.9" color="#ffddbb"></a-light>

    <!-- Ground -->
    <a-plane rotation="-90 0 0" width="100" height="100" color="#001a00" opacity="0.25"></a-plane>

    <!-- Main Temple -->
    <a-entity gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Duck/glTF-Binary/Duck.glb" 
              scale="7 7 7" position="0 0 -8" rotation="0 45 0"></a-entity>

    <!-- Buddha Statue -->
    <a-entity gltf-model="https://assets.babylonjs.com/meshes/BoomBox.glb" 
              scale="2 2 2" position="0 1.5 -12" rotation="0 180 0"></a-entity>

    <!-- Thorana (Big Arch) -->
    <a-entity gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="3.5 3.5 3.5" position="0 5 -18" rotation="0 0 0"></a-entity>

    <!-- Vesak Lanterns -->
    <a-entity class="lantern" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="1.6 1.6 1.6" position="-4 1.8 -6" 
              animation="property: rotation; to: 0 360 0; dur: 14000; loop: true;"></a-entity>

    <a-entity class="lantern" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="1.5 1.5 1.5" position="4 2 -7" 
              animation="property: rotation; to: 0 360 0; dur: 16000; loop: true;"></a-entity>

    <!-- Flying Lanterns -->
    <a-entity class="flying" gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb" 
              scale="0.9 0.9 0.9" position="-3 3 -15" 
              animation="property: position; to: -3 12 -15; dur: 30000; loop: false;"></a-entity>

    <!-- Fireflies -->
    <a-entity position="0 5 -10" particle-system="preset: dust; color: #ffdd77,#ffeeaa; particleCount: 400; size: 0.06"></a-entity>

  </a-scene>

  <div class="controls">
    <button onclick="startAR()">📱 Start Vesak AR</button>
    <button onclick="addLantern()">➕ Add Lantern</button>
  </div>

  <script>
    function startAR() {
      const scene = document.querySelector('a-scene');
      scene.enterVR('immersive-ar');
    }

    function addLantern() {
      const scene = document.querySelector('a-scene');
      const lantern = document.createElement('a-entity');
      
      lantern.setAttribute('gltf-model', 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Lantern/glTF-Binary/Lantern.glb');
      lantern.setAttribute('scale', '1.4 1.4 1.4');
      lantern.setAttribute('animation', 'property: rotation; to: 0 360 0; dur: 13000; loop: true');
      
      scene.appendChild(lantern);
    }

    // Auto add some lanterns when AR starts
    document.querySelector('a-scene').addEventListener('enter-vr', () => {
      console.log("Vesak City AR Started");
    });
  </script>
</body>
</html>
