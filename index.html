<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vesak AR City - Fixed</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<style>
  body { margin:0; overflow:hidden; background:#000; }
  #ui {
    position: fixed; top: 10px; left: 10px; color: #ffddaa; background: rgba(0,0,0,0.7);
    padding: 15px; border-radius: 12px; z-index: 100; font-family: Arial;
  }
  button {
    position: fixed; bottom: 30px; left: 30px; padding: 16px 28px;
    font-size: 18px; background: #ffcc00; color: black; border: none;
    border-radius: 12px; z-index: 1000;
  }
</style>
</head>
<body>

<div id="ui">
  <h2>🌟 Vesak AR City</h2>
  <p id="status">Press Start AR</p>
</div>

<button onclick="startAR()">📱 Start AR Camera</button>

<script>
// Basic Three.js Setup
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 1.6, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
sun.position.set(10, 20, 10);
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({ color: 0x112211 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// === VISIBLE OBJECTS ===
function createLantern(x, z) {
  const group = new THREE.Group();
  
  // Lantern body
  const lantern = new THREE.Mesh(
    new THREE.CylinderGeometry(0.6, 0.5, 1.2, 8),
    new THREE.MeshStandardMaterial({ color: 0xff5500, emissive: 0xff2200, emissiveIntensity: 1.5 })
  );
  group.add(lantern);
  
  // Glow
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0xffdd88, emissive: 0xffaa00, emissiveIntensity: 3 })
  );
  group.add(glow);
  
  group.position.set(x, 1, z);
  return group;
}

// Create visible objects
scene.add(createLantern(-3, -8));
scene.add(createLantern(3, -8));
scene.add(createLantern(0, -15));

// Temple (Big box for now)
const temple = new THREE.Mesh(
  new THREE.BoxGeometry(10, 8, 10),
  new THREE.MeshStandardMaterial({ color: 0xd4b896 })
);
temple.position.set(12, 4, -25);
scene.add(temple);

// Buddha
const buddha = new THREE.Mesh(
  new THREE.SphereGeometry(3, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xffd700 })
);
buddha.position.set(-12, 3, -22);
scene.add(buddha);

// Animation Loop
renderer.setAnimationLoop(() => {
  renderer.render(scene, camera);
});

// === START AR ===
async function startAR() {
  document.getElementById('status').innerHTML = "Starting AR...";
  
  if (!navigator.xr) {
    alert("WebXR not supported on this browser");
    return;
  }

  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test']
    });

    await renderer.xr.setSession(session);
    document.getElementById('status').innerHTML = "✅ AR Active!<br>Tap on floor to place lanterns";

  } catch (e) {
    console.error(e);
    alert("AR Error: " + e.message);
  }
}

// Tap to place lantern in AR
renderer.xr.addEventListener('sessionstart', () => {
  const session = renderer.xr.getSession();
  session.addEventListener('select', () => {
    const lantern = createLantern(0, -5);
    scene.add(lantern);
  });
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
